<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script>
        // Guardiano Sicuro V2
        if (window.location.hostname.includes("github.io")) {

    <title>Ricerca Universale - Bibliotheca Valtortiana</title>
    <style>
        body {
            font-family: 'Georgia', serif; margin: 0; padding: 20px;
            background-color: #2e1a05; color: #333; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }
        .nav-links {
            display: flex; justify-content: center; flex-wrap: wrap;
            width: 100%; max-width: 900px; margin-bottom: 15px; gap: 20px;
        }
        .back-link { 
            color: #d4af37; text-decoration: none; font-weight: bold; 
            transition: color 0.2s; text-align: center;
        }
        .back-link:hover { color: #fff; }
        .search-container {
            background-color: #f4ece0; background-image: url('Quaderni/handmadepaper.png'); 
            max-width: 800px; width: 100%; padding: 30px; border-radius: 8px;
            border: 4px double #8b0000; box-shadow: 0 0 40px rgba(0,0,0,0.7); position: relative; 
        }
        h1 { text-align: center; color: #8b0000; margin-top: 0; border-bottom: 2px solid #dcd8ce; padding-bottom: 20px; }
        .close-search {
            position: absolute; top: 10px; right: 20px; font-size: 30px;
            cursor: pointer; color: #8b0000; font-weight: bold; line-height: 1; transition: transform 0.2s;
        }
        .close-search:hover { color: #d4af37; transform: scale(1.2); }
        .input-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        input[type="text"], input[type="number"] {
            padding: 12px; border: 2px solid #8b0000; border-radius: 4px; flex-grow: 1; font-family: 'Georgia', serif; font-size: 16px;
        }
        .btn-search {
            background-color: #8b0000; color: white; border: none; padding: 10px 25px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s;
        }
        .btn-search:hover { background-color: #a50000; transform: scale(1.05); }
        .search-options { background: #e8e4db; padding: 15px; border-radius: 4px; margin-bottom: 20px; border: 1px solid #ccc; }
        .radio-group { margin-bottom: 10px; }
        label { margin-right: 15px; cursor: pointer; font-size: 0.95em; }
        #globalResults { margin-top: 20px; }
        .book-section { margin-bottom: 30px; }

        .book-title { 
            font-size: 1.2em; color: #fff; background-color: #5d4037; 
            padding: 8px 15px; border-radius: 4px; margin-bottom: 0; 
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
            user-select: none;
        }
        .book-title:hover { background-color: #6d4c41; }
        .book-title .toggle-arrow { font-size: 0.8em; margin-left: 10px; transition: transform 0.2s; }
        .book-title.collapsed .toggle-arrow { transform: rotate(-90deg); }
        .book-results { overflow: hidden; transition: max-height 0.3s ease; margin-bottom: 10px; }
        .book-results.collapsed { display: none; }
        .result-item {
            background: white; border-bottom: 1px solid #dcd8ce; padding: 15px; 
            cursor: pointer; transition: background 0.2s;
        }
        .result-item:first-child { border-top-left-radius: 4px; border-top-right-radius: 4px; }
        .result-item:last-child { border-bottom: none; border-bottom-left-radius: 4px; border-bottom-right-radius: 4px; }
        .result-item:hover { background-color: #fff8e1; border-left: 5px solid #d4af37; padding-left: 10px; }
        .result-item.visited { background-color: #e0d8cc; border-left: 8px solid #5d4037; opacity: 0.8; }
        .result-item.visited .res-cap { color: #5d4037; text-decoration: line-through; text-decoration-color: rgba(0,0,0,0.2); }
        .res-cap { font-weight: bold; color: #8b0000; font-size: 1.05em; }
        .res-snippet { font-style: italic; color: #555; margin-top: 5px; line-height: 1.5; }
        #loading { display: none; text-align: center; font-size: 1.2em; color: #8b0000; font-weight: bold; padding: 20px; }
        .clear-history { float: right; font-size: 0.8em; color: #666; cursor: pointer; text-decoration: underline; margin-top: 5px; }
        @media (max-width: 600px) {
            .nav-links { flex-direction: column; align-items: center; gap: 10px; } 
            .input-group { flex-direction: column; }
            .btn-search { width: 100%; }
        }

        /* Pulsante Comprimi/Espandi tutti (stile coerente con I miei Appunti) */
        #btn-toggle-tutti {
            background-color: #d1cbb8; border: none; color: #5d4037;
            padding: 6px 12px; border-radius: 4px; font-weight: bold; font-size: 0.9em;
            cursor: pointer; transition: 0.2s;
            display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
            margin-left: 15px;
        }
        #btn-toggle-tutti:hover { background-color: #c4bdae; }

        /* STILE DI STAMPA PER RICERCA GLOBALE */
        @media print {
            #btn-toggle-tutti { display: none !important; }
            body { 
                background-color: white !important; 
                background-image: none !important; 
                color: black !important;
                height: auto !important;
                overflow: visible !important;
            }
            .nav-links, .search-container h1, .search-options, .input-group, #loading, .btn-print-pdf, .close-search {
                display: none !important; 
            }
            .search-container {
                border: none !important;
                box-shadow: none !important;
                width: 100% !important;
                max-width: none !important;
                margin: 0 !important;
                padding: 0 !important;
                background: white !important;
            }
            #globalResults { display: block !important; }
            .result-item.visited {
                border-left-color: #555 !important;
                background-color: #eee !important;
                -webkit-print-color-adjust: exact; 
                print-color-adjust: exact;         
            }
            .book-title {
                background-color: #333 !important;
                color: white !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>

    <div class="search-container">

        <h1>Ricerca Globale Universale</h1>

       <div class="search-options">

        <div id="loading">Consultazione dell'intero archivio in corso... ⏳</div>

    <!-- POLIFONIA VALTORTIANA: Archivi dei 2 volumi -->

    <script>
        // === DA PERSONALIZZARE ===
        // Se nel file archivio.js dell'Evangelo la variabile non si chiama "archivio", 
        // cambia la parola "archivio" qui sotto con il nome corretto.
        
        const LIBRARY = [
            { id: 'evangelo', name: "L'Evangelo come mi è stato rivelato", data: (typeof archivioCapitoli !== 'undefined' ? archivioCapitoli : []), file: 'biblioteca/index.html' },
            { id: '1943',   name: 'Quaderni 1943',      data: (typeof quaderni_1943 !== 'undefined' ? quaderni_1943 : []),           file: 'Quaderni/quaderni_1943.html' },
            { id: '1944',   name: 'Quaderni 1944',      data: (typeof quaderni_1944 !== 'undefined' ? quaderni_1944 : []),           file: 'Quaderni/quaderni_1944.html' },
            { id: '45-50',  name: 'Quaderni 1945-1950', data: (typeof quaderni_1945_1950 !== 'undefined' ? quaderni_1945_1950 : []), file: 'Quaderni/quaderni_1945-1950.html' },
            { id: 'quad',   name: 'Quadernetti',        data: (typeof quadernetti !== 'undefined' ? quadernetti : []),               file: 'Quaderni/quadernetti.html' },
            { id: 'azaria', name: 'Libro di Azaria',    data: (typeof libro_azaria !== 'undefined' ? libro_azaria : []),             file: 'Quaderni/libro_azaria.html' },
            { id: 'romani', name: "Lezioni sull'Epistola ai Romani", data: (typeof libro_romani !== 'undefined' ? libro_romani : []), file: 'Quaderni/lezioni_romani.html' },
            { id: 'autobio', name: "Autobiografia",     data: (typeof autobiografia !== 'undefined' ? autobiografia : []),           file: 'Quaderni/autobiografia.html' },

            // --- POLIFONIA VALTORTIANA ---
            { id: 'polifonia_v1', name: "Polifonia Valtortiana - Vol. 1 (A-G)", data: (typeof polifonia_v1 !== 'undefined' ? [...(polifonia_v1.capitoliIniziali || []), ...(polifonia_v1.guide || []), ...(polifonia_v1.capitoliFinali || []), ...(polifonia_v1.lettere || []).flatMap(l => l.voci)] : []), file: 'PolifoniaValtortiana/polifonia.html?vi=0' },
            { id: 'polifonia_v2', name: "Polifonia Valtortiana - Vol. 2 (H-Z)", data: (typeof polifonia_v2 !== 'undefined' ? [...(polifonia_v2.capitoliIniziali || []), ...(polifonia_v2.guide || []), ...(polifonia_v2.capitoliFinali || []), ...(polifonia_v2.lettere || []).flatMap(l => l.voci)] : []), file: 'PolifoniaValtortiana/polifonia.html?vi=1' },
            // NOTA: Aggiungere qui sotto ogni nuovo libro futuro
        ];

        window.addEventListener('pageshow', (event) => {
            const savedSearch = sessionStorage.getItem('valtortaUniversaleSearch');
            if (savedSearch) {
                const data = JSON.parse(savedSearch);
                if (data.type === 'simple') {
                    document.querySelector('input[value="simple"]').checked = true;
                    document.getElementById('simpleInput').value = data.terms[0] || "";
                } else if (data.type === 'simple_exact') {
                    document.querySelector('input[value="simple_exact"]').checked = true;
                    document.getElementById('simpleInput').value = data.terms[0] || "";
                } else if (data.type === 'or_exact') {
                    document.querySelector('input[value="or_exact"]').checked = true;
                    document.getElementById('orWord1').value = data.terms[0] || "";
                    document.getElementById('orWord2').value = data.terms[1] || "";
                } else {
                    document.querySelector('input[value="proximity"]').checked = true;
                    document.getElementById('word1').value = data.terms[0] || "";
                    document.getElementById('word2').value = data.terms[1] || "";
                    document.getElementById('distance').value = data.dist || 30;
                }
                toggleMode();
                performSearchLogic(data.terms, data.type, data.dist);
            }
        });

        function clearSearchHistory() {
            sessionStorage.removeItem('valtortaUniversaleSearch');
            document.getElementById('simpleInput').value = "";
            document.getElementById('orWord1').value = "";
            document.getElementById('orWord2').value = "";
            document.getElementById('word1').value = "";
            document.getElementById('word2').value = "";
            document.getElementById('globalResults').innerHTML = "";
        }

        function toggleMode() {
            const type = document.querySelector('input[name="searchType"]:checked').value;
            // Il box 'simpleBox' serve sia per la ricerca parziale che per quella esatta!
            document.getElementById('simpleBox').style.display = (type === 'simple' || type === 'simple_exact') ? 'flex' : 'none';
            document.getElementById('orBox').style.display = (type === 'or_exact') ? 'flex' : 'none';
            document.getElementById('proximityBox').style.display = (type === 'proximity') ? 'flex' : 'none';
        }
        function handleEnter(e) { if(e.key === 'Enter') startSearch(); }

        function startSearch() {
            const type = document.querySelector('input[name="searchType"]:checked').value;
            let terms = [];
            let dist = 30;

            if (type === 'simple' || type === 'simple_exact') {
                const val = document.getElementById('simpleInput').value.trim();
                if (val.length < 3) { alert("Inserisci almeno 3 lettere."); return; }
                terms = [val];
            } else if (type === 'or_exact') {
                const w1 = document.getElementById('orWord1').value.trim();
                const w2 = document.getElementById('orWord2').value.trim();
                if (!w1 || !w2) { alert("Inserisci entrambe le parole."); return; }
                terms = [w1, w2];
            } else {
                const w1 = document.getElementById('word1').value.trim();
                const w2 = document.getElementById('word2').value.trim();
                dist = parseInt(document.getElementById('distance').value) || 30;
                if (!w1 || !w2) { alert("Inserisci entrambe le parole."); return; }
                terms = [w1, w2];
            }

            const searchData = { type: type, terms: terms, dist: dist };
            sessionStorage.setItem('valtortaUniversaleSearch', JSON.stringify(searchData));
            performSearchLogic(terms, type, dist);
        }

        function visitAndGo(link, uniqueId, element) {
            element.classList.add('visited');
            let visited = JSON.parse(sessionStorage.getItem('valtortaVisitedItems') || '[]');
            if(!visited.includes(uniqueId)) {
                visited.push(uniqueId);
                sessionStorage.setItem('valtortaVisitedItems', JSON.stringify(visited));
            }
            window.location.href = link;
        }

        function performSearchLogic(terms, type, dist) {
            const resContainer = document.getElementById('globalResults');
            const loader = document.getElementById('loading');
            const visitedItems = JSON.parse(sessionStorage.getItem('valtortaVisitedItems') || '[]');

            resContainer.innerHTML = "";
            loader.style.display = "block";

            setTimeout(() => {
                let totalFound = 0;
                let htmlOutput = "";

                LIBRARY.forEach(book => {
                    if (!book.data || book.data.length === 0) return;
                    const bookResults = searchInBook(book.data, terms, type, dist);
                    
                    if (bookResults.length > 0) {
                        totalFound += bookResults.length;
                        htmlOutput += `<div class="book-section">`;
                        htmlOutput += `<div class="book-title" onclick="toggleBook(this)">${book.name} (${bookResults.length}) <span class="toggle-arrow">▼</span></div>`;
                        htmlOutput += `<div class="book-results">`;
                        bookResults.forEach(res => {
                            const keywordsSafe = encodeURIComponent(terms.join(','));
                            const modeParam = (type === 'simple') ? '&mode=partial' : '&mode=exact';
                            const separator = book.file.includes('?') ? '&' : '?';
                            const link = `${book.file}${separator}idx=${res.idx}&keys=${keywordsSafe}&from=universale${modeParam}`;
                            const uniqueId = book.id + '-' + res.idx;
                            const isVisited = visitedItems.includes(uniqueId);
                            const visitedClass = isVisited ? ' visited' : '';

                            htmlOutput += `
                            <div class="result-item${visitedClass}" onclick="visitAndGo('${link}', '${uniqueId}', this)">
                                <div class="res-cap">${res.title}</div>
                                <div class="res-snippet">${res.snippet}</div>
                            </div>`;
                        });
                        htmlOutput += `</div></div>`;
                    }
                });

                loader.style.display = "none";
                
                if (totalFound === 0) {
                    resContainer.innerHTML = "<p style='text-align:center; font-style:italic;'>Nessun risultato trovato in nessuna opera.</p>";
                } else {
                    const printBtn = `<button class="btn-print-pdf" onclick="bvPrint()" style="margin-left:15px; cursor:pointer; background:none; border:1px solid #8b0000; padding:5px 10px; border-radius:5px; color:#8b0000; font-weight:bold;">🖨️ Stampa elenco PDF</button>`;
                    const toggleAllBtn = `<button id="btn-toggle-tutti" onclick="toggleAllBooks()">🔽 Comprimi Tutti</button>`;
                    resContainer.innerHTML = `<div style="text-align:center; margin-bottom:20px; color:#666;">
                        Trovati <b>${totalFound}</b> risultati totali. ${printBtn} ${toggleAllBtn}
                    </div>` + htmlOutput;
                }                
                  }, 50); 
        }

        // Comprimi / espandi tutti i libri trovati (rispecchia il pattern di miei_appunti.html)
        function toggleAllBooks() {
            const btn = document.getElementById('btn-toggle-tutti');
            if (!btn) return;
            const isComprimendo = btn.innerText.includes('Comprimi');
            
            document.querySelectorAll('.book-title').forEach(el => {
                if (isComprimendo) el.classList.add('collapsed');
                else el.classList.remove('collapsed');
            });
            document.querySelectorAll('.book-results').forEach(el => {
                if (isComprimendo) el.classList.add('collapsed');
                else el.classList.remove('collapsed');
            });
            
            btn.innerText = isComprimendo ? '▶️ Espandi Tutti' : '🔽 Comprimi Tutti';
        }

        function searchInBook(data, terms, type, dist, bookName) {
            const results = [];
            const p1 = terms[0].toLowerCase();
            const p2 = terms[1] ? terms[1].toLowerCase() : null;

            // Questo trucco ci permette di leggere sia gli Array (Opere minori) che gli Oggetti (Evangelo)
            const chiavi = Object.keys(data);

            chiavi.forEach(key => {
                const cap = data[key];
                const idx = key; // Questo sarà "1", "2" per l'Evangelo, o "0", "1" per i Quaderni

                try {
                    let capTesto = "";
                    
                    if (typeof cap === 'string') {
                        capTesto = cap;
                    } else if (cap && typeof cap === 'object') {
                        capTesto = cap.testo || cap.contenuto || cap.html || cap.text || "";
                    }

                    capTesto = String(capTesto); 
                    
                    let cleanText = capTesto
                        .replace(/<[^>]+>/g, " ")        // rimuove tag HTML
                        .replace(/&nbsp;/g, " ")          // spazio non-breaking
                        .replace(/&[a-z]+;/gi, " ")       // altre entità HTML (es. &amp; &laquo; &raquo;)
                        .replace(/&#\d+;/g, " ")          // entità numeriche (es. &#160;)
                        .replace(/\s+/g, " ")             // normalizza spazi multipli
                        .toLowerCase();
                    if(!cleanText || cleanText === "undefined") return; 

                    let found = false;
                    let snippet = "";

                    // Evidenzia la parola cercata nello snippet
                    // Usa \p{L} (Unicode letter) per riconoscere correttamente tutte le lettere accentate
                    const highlightWord = (text, word) => {
                        const safeW = word.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
                        const re = new RegExp('(?<!\\p{L})(' + safeW + ')(?!\\p{L})', 'giu');
                        return text.replace(re, '<strong style="color:#8b0000;background:#fff3cd;padding:0 2px;">$1</strong>');
                    };

                    if (type === 'simple') {
                        if (cleanText.includes(p1)) {
                            found = true;
                            const pos = cleanText.indexOf(p1);
                            const raw = "..." + cleanText.substring(Math.max(0, pos - 40), Math.min(cleanText.length, pos + 60)) + "...";
                            snippet = raw.replace(new RegExp(p1.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&'), 'gi'), '<strong style="color:#8b0000;background:#fff3cd;padding:0 2px;">$&</strong>');
                        }
                    } else if (type === 'simple_exact') {
                        // Creiamo un'espressione regolare per cercare 1 parola ESATTA
                        const safeP1 = p1.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
                        const exactRegex = new RegExp('(?<!\\p{L})' + safeP1 + '(?!\\p{L})', 'iu');
                        
                        const match = cleanText.match(exactRegex);
                        if (match) {
                            found = true;
                            const pos = match.index;
                            const raw = "..." + cleanText.substring(Math.max(0, pos - 40), Math.min(cleanText.length, pos + 60)) + "...";
                            snippet = highlightWord(raw, p1);
                        }
                    } else if (type === 'or_exact') {
                        // Creiamo un'espressione regolare per cercare la parola 1 OPPURE la parola 2 in modo ESATTO
                        const safeP1 = p1.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
                        const safeP2 = p2.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
                        const exactRegex = new RegExp('(?<!\\p{L})(' + safeP1 + '|' + safeP2 + ')(?!\\p{L})', 'iu');
                        
                        const match = cleanText.match(exactRegex);
                        if (match) {
                            found = true;
                            const pos = match.index;
                            const raw = "..." + cleanText.substring(Math.max(0, pos - 40), Math.min(cleanText.length, pos + 60)) + "...";
                            snippet = highlightWord(raw, p1);
                            snippet = highlightWord(snippet, p2);
                        }
                    } else {
                        // Concordanze: ricerca esatta con confini di parola Unicode
                        const safeP1c = p1.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
                        const safeP2c = p2.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
                        const exactRe1 = new RegExp('(?<!\\p{L})' + safeP1c + '(?!\\p{L})', 'iu');
                        const exactRe2 = new RegExp('(?<!\\p{L})' + safeP2c + '(?!\\p{L})', 'iu');
                        const words = cleanText.split(/\s+/).filter(w => w.length > 0);
                        let idx1 = [], idx2 = [];
                        words.forEach((w, i) => {
                            if (exactRe1.test(w)) idx1.push(i);
                            if (exactRe2.test(w)) idx2.push(i);
                        });
                        
                        if (idx1.length > 0 && idx2.length > 0) {
                            let minD = Infinity; let bestPos = 0;
                            idx1.forEach(i1 => {
                                idx2.forEach(i2 => {
                                    let d = Math.abs(i1 - i2);
                                    if (d < minD) { minD = d; bestPos = Math.min(i1, i2); }
                                });
                            });
                            if (minD <= dist) {
                                found = true;
                                const start = Math.max(0, bestPos - 10);
                                const end = Math.min(words.length, bestPos + dist + 10);
                                let rawSnippet = "..." + words.slice(start, end).join(" ") + "...";
                                snippet = highlightWord(rawSnippet, p1);
                                snippet = highlightWord(snippet, p2);
                            }
                        }
                    }

                    if (found) {
                        let title = "Capitolo " + idx; // Usiamo direttamente l'indice o la chiave
                        
                        if (typeof cap === 'object') {
                            if (cap.titolo) {
                                title = cap.lezione ? (cap.lezione + " - " + cap.titolo) : cap.titolo;
                            } else if (cap.lezione) {
                                title = cap.lezione;
                            } else if (cap.data) {
                                title += " - " + cap.data;
                            } else {
                                const matchH3 = capTesto.match(/<h3>([\s\S]*?)<\/h3>/i);
                                if (matchH3) title = matchH3[1].replace(/<[^>]+>/g, "").trim();
                                else if (cap.anno) title += " (" + cap.anno + ")";
                            }
                        }
                        results.push({ idx: idx, title: title, snippet: snippet });
                    }
                } catch (err) {
                    console.warn(`Errore ignorato nel libro "${bookName}", capitolo indice ${idx}:`, err);
                }
            });
            return results;
        }
            </script>
