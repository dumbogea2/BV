<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script>
        if (window.location.hostname.includes("github.io")) {
            document.documentElement.style.display = 'none';
        }
    </script>
    
    <title>Riprendi la lettura</title>
    <style>
        body {
            font-family: 'Georgia', serif; margin: 0; padding: 20px;
            background-color: #f4ece0; color: #333;
            display: flex; flex-direction: column; align-items: center;
        }
        .header {
            width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 3px double #0056b3; padding-bottom: 15px; margin-bottom: 30px;
        }
        .header h1 { margin: 0; color: #0056b3; font-size: 24px; }
        .btn-back {
            text-decoration: none; background-color: #0056b3; color: white;
            padding: 8px 15px; border-radius: 4px; font-weight: bold; font-size: 14px; transition: 0.2s;
        }
        .btn-back:hover { background-color: #003d82; }
        .btn-svuota {
            background-color: transparent; border: 1px solid #d9534f; color: #d9534f;
            cursor: pointer; padding: 6px 12px; border-radius: 4px; font-size: 13px; font-weight: bold; margin-left: 10px; transition: 0.2s;
        }
        .btn-svuota:hover { background-color: #ffebee; }
        
        #cronologia-container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 15px; }
        
        .cronologia-card {
            background: white; border: 1px solid #b3d7ff; border-radius: 8px;
            padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-decoration: none; color: inherit; display: block;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .cronologia-card:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.1); border-color:#0056b3; }
        
        .cronologia-header { font-size: 0.9rem; font-weight: bold; color: #0056b3; text-transform: uppercase; margin-bottom: 5px; }
        .cronologia-titolo { font-size: 1.1rem; color: #444; }
        .empty-state { text-align: center; color: #666; font-style: italic; padding: 40px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🕒 Riprendi la Lettura</h1>
        <div>
            <button class="btn-svuota" onclick="clearGlobalHistory()">🗑️ Svuota Lista</button>
            <a href="index.html" class="btn-back">🏠 Home</a>
        </div>
    </div>

    <div id="cronologia-container"></div>

    <script>
        // BIVIO LOGICO
        const isCloudMode = localStorage.getItem('modalita_lettura') === 'cloud';
        let utenteCloud = null;
        let db = null, collection = null, getDocs = null, query = null, orderBy = null, limit = null, deleteDoc = null;

        if (isCloudMode) {
            (async function initFirebase() {
                try {
                    const fApp = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js");
                    const fAuth = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js");
                    const fDb = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");

                    const firebaseConfig = {
                        apiKey: "AIzaSyBHEhVjlZIs-mIPnteFiOiBgHryL1R9_Zk",
                        authDomain: "appuntivaltorta.firebaseapp.com",
                        projectId: "appuntivaltorta",
                        storageBucket: "appuntivaltorta.firebasestorage.app",
                        messagingSenderId: "940851152715",
                        appId: "1:940851152715:web:0e47bd8ca7282efac3cace"
                    };

                    const app = fApp.initializeApp(firebaseConfig);
                    const auth = fAuth.getAuth(app);
                    db = fDb.getFirestore(app);
                    
                    collection = fDb.collection; getDocs = fDb.getDocs; 
                    query = fDb.query; orderBy = fDb.orderBy; limit = fDb.limit;
                    deleteDoc = fDb.deleteDoc; fDb.doc;

                    fAuth.onAuthStateChanged(auth, (user) => {
                        if (user) { utenteCloud = user; renderGlobalHistory(); }
                        else { window.location.href = "login.html"; }
                    });
                } catch(e) { console.error("Modalità Cloud non disponibile"); }
            })();
        } else {
            window.onload = renderGlobalHistory;
        }

        async function renderGlobalHistory() {
            let history = [];

            if (isCloudMode) {
                if (!utenteCloud || !db) return;
                
                if (!navigator.onLine) {
                    // Modalità Aereo: carica istantaneo
                    history = JSON.parse(localStorage.getItem('valtorta_cronologia_globale')) || [];
                } else {
                    try {
                        const q = query(collection(db, `utenti/${utenteCloud.uid}/cronologia`), orderBy("timestamp", "desc"), limit(20));
                        const snapshot = await getDocs(q);
                        snapshot.forEach(doc => history.push(doc.data()));
                        // Copia locale per sicurezza
                        localStorage.setItem('valtorta_cronologia_globale', JSON.stringify(history));
                    } catch(e) {
                        history = JSON.parse(localStorage.getItem('valtorta_cronologia_globale')) || [];
                    }
                }
            } else {
                history = JSON.parse(localStorage.getItem('valtorta_cronologia_globale')) || [];
            }

            const container = document.getElementById('cronologia-container');

            if (history.length === 0) {
                container.innerHTML = `<div class="empty-state">La tua cronologia è vuota.<br>Inizia a leggere un capitolo per salvarlo qui!</div>`;
                return;
            }

            container.innerHTML = history.map(item => {
                let intestazioneBlu = "📖 " + item.opera;
                if (item.opera === "L'Evangelo") intestazioneBlu += " - Cap. " + item.id;

                let finalUrl = item.url;
                if (!isCloudMode && !finalUrl.includes('/') && finalUrl.includes('.html')) {
                    finalUrl = finalUrl; 
                }

                return `
                <a href="${finalUrl}" class="cronologia-card">
                    <div class="cronologia-header">${intestazioneBlu}</div>
                    <div class="cronologia-titolo">${item.titolo}</div>
                </a>
                `;
            }).join('');
        }

        async function clearGlobalHistory() {
            if(confirm("Vuoi svuotare la cronologia delle letture recenti?")) {
                // Svuota sempre il locale
                localStorage.removeItem('valtorta_cronologia_globale');
                
                if (isCloudMode && utenteCloud && db) {
                    try {
                        const snapshot = await getDocs(collection(db, `utenti/${utenteCloud.uid}/cronologia`));
                        snapshot.forEach(async (documento) => {
                            await deleteDoc(documento.ref);
                        });
                    } catch(e) { console.warn("Offline: Impossibile svuotare il cloud ora."); }
                }
                setTimeout(renderGlobalHistory, 500);
            }
        }
    </script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBHEhVjlZIs-mIPnteFiOiBgHryL1R9_Zk",
            authDomain: "appuntivaltorta.firebaseapp.com",
            projectId: "appuntivaltorta",
            storageBucket: "appuntivaltorta.firebasestorage.app",
            messagingSenderId: "940851152715",
            appId: "1:940851152715:web:0e47bd8ca7282efac3cace"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Controlliamo se stiamo navigando dal web (GitHub)
        const isOnline = window.location.hostname.includes("github.io");

        if (isOnline) {
            // Chiediamo a Firebase se l'utente è autenticato
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    // È autorizzato! Sblocchiamo la pagina nascosta dal guardiano
                    document.documentElement.style.display = '';
                    document.body.style.display = "flex"; 
                    localStorage.setItem('modalita_lettura', 'cloud');
                } else {
                    // Non è autorizzato! Lo rimandiamo al login.
                    window.location.replace("/BV/login.html"); 
                }
            });
        }
    </script>
</body>
</html>
