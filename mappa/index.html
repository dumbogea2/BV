        var bounds = [[-156, 0], [0, 132]];

        L.tileLayer('mappa_palestina/{z}/{y}/{x}.jpg', { minZoom: 0, maxZoom: 6, noWrap: true }).addTo(map);
        map.fitBounds(bounds);

        // --- 4. FUNZIONI ---
        function inizializzaRicerca() {
            var dataList = document.getElementById('places-list');
            Object.keys(database).sort().forEach(function(nome) {
                var option = document.createElement('option');
                option.value = nome;
                dataList.appendChild(option);
            });
        }

        window.cercaLuogo = function(nome) {
            var dati = database[nome];
            if (dati) {
                var tipoIcona = icone[dati.tipo] || icone["default"];
                map.flyTo(dati.coords, 5, { duration: 1.5 });
                L.marker(dati.coords, { icon: tipoIcona }).addTo(map)
                    .bindPopup("<b>" + nome + "</b><br>Tipo: " + dati.tipo)
                    .openPopup();
            }
        };

        map.on('mousemove', function(e) {
            document.getElementById('live-coords').innerText = e.latlng.lat.toFixed(1) + " , " + e.latlng.lng.toFixed(1);
        });

        inizializzaRicerca();
        
        // --- 5. LEGGI LE COORDINATE DALL'URL E CENTRA LA MAPPA ---
        const urlParams = new URLSearchParams(window.location.search);
        const coordsParam = urlParams.get('coords');

        if (coordsParam) {
            const parti = coordsParam.split(',');
            const lat = parseFloat(parti[0]);
            const lng = parseFloat(parti[1]);
            const coordinateEsatte = [lat, lng];

            // Diciamo alla mappa di volare esattamente in quel punto!
            map.flyTo(coordinateEsatte, 5, { duration: 1.5 });
            
            // Aggiungiamo anche un marker animato per farlo risaltare
            L.marker(coordinateEsatte, { icon: icone["sacro"] }).addTo(map)
                .bindPopup("<b>Luogo del Capitolo</b>")
                .openPopup();
        }

        // --- CONTROLLO ACCESSO DINAMICO V2 (Anti-Crash Offline) ---
        (async function checkAuthMappa() {
            const isOnline = window.location.hostname.includes("github.io");
            if (isOnline) {
                try {
                    const fApp = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js");
                    const fAuth = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js");

                    const firebaseConfig = {
                        apiKey: "AIzaSyBHEhVjlZIs-mIPnteFiOiBgHryL1R9_Zk",
                        authDomain: "appuntivaltorta.firebaseapp.com",
                        projectId: "appuntivaltorta",
                        storageBucket: "appuntivaltorta.firebasestorage.app",
                        messagingSenderId: "940851152715",
                        appId: "1:940851152715:web:0e47bd8ca7282efac3cace"
                    };

                    const app = fApp.getApps().length === 0 ? fApp.initializeApp(firebaseConfig) : fApp.getApp();
                    const auth = fAuth.getAuth(app);

                    fAuth.onAuthStateChanged(auth, (user) => {
                        if (user) {
                            // È autorizzato! Ripristiniamo la visibilità
                            document.documentElement.style.display = '';
                            document.body.style.display = "block"; 
                            localStorage.setItem('modalita_lettura', 'cloud');
                        } else {
                            window.location.replace("/BV/login.html"); 
                        }
                    });
                } catch (error) {
                    console.warn("Modalità offline attiva.");
                    // In caso di offline, sblocca la pagina
                    document.documentElement.style.display = '';
                    document.body.style.display = "block";
                }
            }
        })();
