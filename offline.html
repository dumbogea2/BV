<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modalità Offline</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #e3dac9; /* <-- Sfondo avorio scuro */
            color: #333; /* <-- Testo scuro per contrasto */
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        
        .container {
            padding: 20px;
            background-color: rgba(255, 255, 240, 0.95); /* <-- Riquadro in tinta con la Home */
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); /* <-- Ombra più delicata */
            max-width: 400px;
        }
                h1 {
            color: #ff9800; /* Un arancione per catturare l'attenzione */
        }
        p {
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .btn-home {
            background-color: white;
            color: #202020;
            padding: 10px 20px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            transition: background-color 0.3s;
        }
        .btn-home:hover {
            background-color: #ddd;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Sei Offline ✈️</h1>
        <p>Questa sezione (come i video o le presentazioni esterne) richiede una connessione a Internet per funzionare.</p>
        <p>Disattiva la modalità aereo o connettiti a una rete Wi-Fi per visualizzare questo contenuto.</p>
        <a href="index.html" class="btn-home">Torna al Portale</a>
    </div>

</body>
</html>
