<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accesso Privato - Appunti Valtorta</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background-color: #f4ece0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-top: 5px solid #8b0000;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-card h2 {
            color: #8b0000;
            margin-top: 0;
        }
        .login-card p {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }
        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
        }
        button {
            width: 100%;
            background-color: #8b0000;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background-color: #a50000;
        }
        #error-msg {
            color: #d32f2f;
            font-size: 0.85rem;
            margin-top: 15px;
            display: none;
        }
        .offline-link {
            display: block;
            margin-top: 25px;
            font-size: 0.85rem;
            color: #0056b3;
            text-decoration: none;
        }
        .offline-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>🔒 Accesso Riservato</h2>
        <p>Inserisci le credenziali del tuo invito per accedere agli appunti sincronizzati in Cloud.</p>
        
        <input type="email" id="email" placeholder="La tua Email" required>
        <div style="position: relative; width: 100%;">
            <input type="password" id="password" placeholder="Password" required>
            <span id="togglePassword" style="position: absolute; right: 10px; top: 35%; cursor: pointer; font-size: 1.2rem;" title="Mostra/Nascondi Password">
                👁️
            </span>
        </div>
        
        <button id="btnLogin">Accedi al Cloud</button>
        <div id="error-msg">Credenziali non valide. Riprova.</div>

        <a href="index.html" class="offline-link">Continua in modalità offline (Salvataggio locale)</a>
    </div>

    <script type="module">
        // Importiamo solo le funzioni che ci servono da Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Le tue chiavi segrete
        const firebaseConfig = {
            apiKey: "AIzaSyBHEhVjlZIs-mIPnteFiOiBgHryL1R9_Zk",
            authDomain: "appuntivaltorta.firebaseapp.com",
            projectId: "appuntivaltorta",
            storageBucket: "appuntivaltorta.firebasestorage.app",
            messagingSenderId: "940851152715",
            appId: "1:940851152715:web:0e47bd8ca7282efac3cace"
        };

        // Inizializziamo Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // --- LOGICA MOSTRA/NASCONDI PASSWORD ---
        const togglePassword = document.querySelector('#togglePassword');
        const passwordField = document.querySelector('#password');

        togglePassword.addEventListener('click', function () {
            // Cambia il tipo di input (da password a testo e viceversa)
            const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordField.setAttribute('type', type);
            
            // Cambia l'icona (Occhio aperto / Occhio chiuso)
            this.textContent = type === 'password' ? '👁️' : '🙈';
        });
        // Gestione del bottone di accesso
        document.getElementById('btnLogin').addEventListener('click', () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            errorMsg.style.display = 'none';

            if(!email || !password) {
                errorMsg.innerText = "Inserisci email e password.";
                errorMsg.style.display = 'block';
                return;
            }

            // Tentativo di login con Firebase
            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    // SUCCESSO!
                    // Salviamo un "gettone" nel browser per ricordarci che l'utente è in modalità Cloud
                    localStorage.setItem('modalita_lettura', 'cloud');
                    
                    // Lo mandiamo alla home del libro
                    window.location.href = "index.html"; 
                })
                .catch((error) => {
                    // ERRORE (password sbagliata, utente inesistente)
                    console.error(error.code, error.message);
                    errorMsg.innerText = "Accesso negato. Controlla le credenziali o chiedi l'invito all'amministratore.";
                    errorMsg.style.display = 'block';
                });
        });
        // --- NOVITÀ: Nascondi il tasto offline se siamo su GitHub ---
        const isOnline = window.location.hostname.includes("github.io");
        if (isOnline) {
            document.querySelector('.offline-link').style.display = 'none';
        }
    </script>

</body>
</html>
