<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script>
        // Guardiano Sicuro V2
        if (window.location.hostname.includes("github.io")) {
            if (navigator.onLine) {
                document.documentElement.style.display = 'none';
            }
        }
    </script>
    <title>Quaderni 1944</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            margin: 0; padding: 0; display: flex; height: 100vh; color: #333;
            /* SFONDO */
            background-image: url('Quaderni2.png');
            background-size: cover; background-position: center; background-repeat: no-repeat;
        }
        
        /* --- SIDEBAR --- */
        #sidebar {
            width: 320px; background-color: rgba(232, 228, 219, 0.95);
            border-right: 1px solid #d1cbb8; display: flex; flex-direction: column; flex-shrink: 0; height: 100vh; overflow: hidden; 
        }
        .home-button-container { padding: 10px; text-align: center; background-color: rgba(209, 203, 184, 0.9); border-bottom: 1px solid #c0b9a3; flex-shrink: 0; display: flex; gap: 5px; flex-direction: column; }
        
        .nav-btn { text-decoration: none; color: #8b0000; font-weight: bold; font-size: 0.95em; display: block; padding: 8px; border: 1px solid #8b0000; border-radius: 4px; background-color: #f4f1ea; transition: all 0.3s; cursor: pointer; }
        .nav-btn:hover { background-color: #8b0000; color: white; }
        
        #sidebar-header { padding: 15px; background-color: rgba(232, 228, 219, 0.6); font-weight: bold; text-align: center; border-bottom: 1px solid #c0b9a3; flex-shrink: 0; }
        #chapter-scroll-area { overflow-y: auto; flex-grow: 1; }
        #chapter-list { list-style: none; padding: 0; margin: 0; }
        
        /* --- TIMELINE NELLA SIDEBAR --- */
        #chapter-list { 
            position: relative; padding: 10px 0; margin: 0; list-style: none; 
        }
        
        /* 1. La linea verticale dorata */
        #chapter-list::before {
            content: ''; position: absolute; top: 0; bottom: 0; left: 24px;
            width: 3px; background-color: #d1cbb8; z-index: 1;
        }

        .chapter-item { 
            position: relative; padding: 15px 20px 15px 45px; 
            border-bottom: 1px solid rgba(209, 203, 184, 0.4); 
            cursor: pointer; font-size: 15px; transition: all 0.2s; line-height: 1.4;
        }
        
        /* 2. Il pallino sulla linea per ogni data */
        .chapter-item::after {
            content: ''; position: absolute; left: 19px; top: 22px; width: 10px; height: 10px;
            background-color: #e8e4db; border: 2px solid #8b0000; border-radius: 50%; z-index: 2;
            transition: all 0.2s;
        }

        /* 3. Effetti al passaggio del mouse */
        .chapter-item:hover { background-color: rgba(220, 216, 206, 0.8); }
        .chapter-item:hover::after { background-color: #8b0000; }

        /* 4. Effetto del capitolo attualmente in lettura */
        .chapter-item.active { background-color: rgba(201, 195, 176, 0.9); }
        .chapter-item.active::after { 
            background-color: #ffd700; border-color: #8b0000; transform: scale(1.3); 
        }
        
        .chapter-date { 
            display: block; font-size: 0.85em; color: #8b0000; margin-top: 4px; font-weight: bold; 
        }
        .chapter-item.active .chapter-date { color: #5d4037; }

        /* --- MAIN CONTENT --- */
        #main-content {
            flex-grow: 1; padding: 40px 60px; overflow-y: auto; line-height: 1.8; font-size: 18px; max-width: 100%;
            background-color: rgba(244, 241, 234, 0.93); box-shadow: -5px 0 15px rgba(0,0,0,0.1);
        }
        #text-wrapper { max-width: 900px; margin: 0 auto; }
        h3 { color: #8b0000; border-bottom: 2px solid #8b0000; padding-bottom: 10px; margin-top: 0; }
        .chapter-footer { margin-top: 60px; padding-top: 30px; border-top: 1px solid #ccc; font-size: 0.9em; color: #555; text-align: center; }
        .source-link a { display: inline-block; margin-top: 10px; padding: 10px 20px; background-color: #e8e4db; color: #8b0000; text-decoration: none; border-radius: 5px; border: 1px solid #d1cbb8; font-weight: bold; }
        #nav-buttons { display: flex; justify-content: space-between; margin-top: 40px; padding-top: 20px; }
        
        button.nav-action { padding: 10px 20px; font-family: 'Georgia', serif; font-size: 16px; cursor: pointer; background-color: #8b0000; color: white; border: none; border-radius: 4px; }
        button.nav-action:disabled { background-color: #ccc; cursor: not-allowed; }
        button.nav-action:hover:not(:disabled) { background-color: #a50000; }

        /* --- MODALE DI RICERCA --- */
        #searchModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: flex-start;
            padding-top: 50px;
        }
        .search-panel {
            background-color: #f4ece0; border: 4px double #8b0000; border-radius: 8px;
            width: 90%; max-width: 700px; padding: 25px; box-shadow: 0 0 30px #000;
            max-height: 85vh; overflow-y: auto; position: relative;
        }
        .close-search {
            position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer; color: #8b0000; font-weight: bold;
        }
        .search-section { margin-bottom: 20px; border-bottom: 1px solid #ccc; padding-bottom: 20px; }
        .search-title { color: #8b0000; font-weight: bold; margin-bottom: 10px; display: block; }
        
        .input-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
        input[type="text"], input[type="number"] {
            padding: 8px; border: 1px solid #8b0000; border-radius: 4px; flex-grow: 1; font-family: inherit;
        }
        .btn-search {
            background-color: #8b0000; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold;
        }
        .btn-search:hover { background-color: #a50000; }

        /* TASTO RESET */
        .btn-reset {
            background-color: #5d4037; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.9em;
        }
        .btn-reset:hover { background-color: #3e2723; }

        /* RISULTATI RICERCA */
        #searchResults { margin-top: 10px; border-top: 2px solid #dcd8ce; padding-top: 15px; }
        .result-item {
            background: white; border: 1px solid #dcd8ce; padding: 10px; margin-bottom: 8px; border-radius: 4px; cursor: pointer; transition: background 0.3s;
        }
        .result-item:hover { background-color: #fff8e1; border-color: #ffd700; }
        
        /* Stile visitato */
        .result-item.visited { 
            background-color: #e8e4db; border-left: 5px solid #d4af37; color: #555; box-shadow: inset 0 0 5px rgba(0,0,0,0.1);
        }
        .result-item.visited .result-cap { color: #5d4037; }

        .result-cap { font-weight: bold; color: #8b0000; font-size: 0.9em; }
        .result-snippet { font-size: 0.9em; color: #444; font-style: italic; margin-top: 4px; }
        mark.highlight { background-color: #ffd700; color: #000; padding: 0 2px; border-radius: 2px; }

        /* Tasto Fluttuante Ricerca */
        #btn-back-search {
            display: none; position: fixed; top: 100px; right: 30px;
            padding: 10px 20px; background-color: #d4af37; color: #2e1a05;
            border: 2px solid #8b0000; border-radius: 50px;
            font-weight: bold; font-size: 14px;
            cursor: pointer; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: transform 0.2s;
        }
        #btn-back-search:hover { transform: scale(1.05); background-color: #fff; }

        /* --- NUOVO: BOTTONE STAMPA FLUTTUANTE --- */
        #floating-print-btn {
            display: none; 
            position: fixed;
            bottom: 30px;
            right: 40px;
            background-color: #8b0000;
            color: white;
            border: none;
            border-radius: 50%;
            width: 55px;
            height: 55px;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 1000;
            transition: background-color 0.3s, transform 0.2s;
            align-items: center;
            justify-content: center;
        }
        
        #floating-print-btn:hover {
            background-color: #a50000;
            transform: scale(1.1);
        }

        @media (max-width: 768px) { 
            body { flex-direction: column; } 
            #sidebar { width: 100%; height: auto; max-height: 300px; } 
            #main-content { padding: 20px; } 
            #btn-back-search { top: auto; bottom: 20px; right: 20px; } 

            /* Adattamento bottone stampa mobile */
            #floating-print-btn {
                bottom: 80px; /* Alzato per non coprire il tasto "Torna ai Risultati" */
                right: 20px;
                width: 50px;
                height: 50px;
                font-size: 22px;
            }
        }
        
        /* --- STILI DI STAMPA INTELLIGENTI --- */
        @media print {
            body { background: white !important; height: auto !important; overflow: visible !important; }

            /* Elementi sempre nascosti in stampa */
            #sidebar, #btn-back-search, .close-search, .search-section, .btn-reset, .btn-print-pdf, #floating-print-btn, #nav-buttons {
                display: none !important;
            }

            /* 1. Modalità Stampa Capitolo (predefinita) */
            body:not(.print-search-mode) #searchModal { display: none !important; }
            body:not(.print-search-mode) #main-content {
                display: block !important;
                box-shadow: none !important;
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
                max-width: 100% !important;
                background: white !important;
            }

            /* 2. Modalità Stampa Risultati di Ricerca (attivata da Javascript) */
            body.print-search-mode #main-content { display: none !important; }
            body.print-search-mode #searchModal {
                position: static !important;
                display: block !important;
                background: white !important;
                height: auto !important;
                width: 100% !important;
                padding: 0 !important;
                overflow: visible !important;
            }
            body.print-search-mode .search-panel {
                border: none !important;
                box-shadow: none !important;
                width: 100% !important;
                max-width: none !important;
                max-height: none !important;
                overflow: visible !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            body.print-search-mode .search-panel h2 {
                color: black !important;
                border-bottom: 2px solid #000;
                text-align: left !important;
            }
            body.print-search-mode #searchResults {
                display: block !important;
                border: none !important;
            }
            body.print-search-mode .result-item {
                page-break-inside: avoid;
                border: 1px solid #ccc !important;
                color: black !important;
                margin-bottom: 10px !important;
            }
            body.print-search-mode .result-item.visited {
                background-color: #eee !important;
                border-left: 5px solid #555 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style> 
</head>
<body>
    <button id="btn-back-search" onclick="openSearch()">🔙 Torna ai Risultati</button>

   <div id="sidebar">
        <div class="home-button-container">
            <a href="home.html" class="nav-btn">← Torna alla Home</a>
            <button onclick="openSearch()" class="nav-btn">🔍 Cerca nei Quaderni 1944</button>
            
            <a href="ricerca.html" class="nav-btn" style="background-color:#5d4037; color:white;">🌐 Ricerca nelle opere minori</a>
            
        </div>
        <div id="sidebar-header">INDICE ...</div>
        <div id="chapter-scroll-area"><ul id="chapter-list"></ul></div>
    </div>
    
    <div id="main-content">
        <div id="text-wrapper">
            <div id="text-container">Seleziona un capitolo dall'indice per iniziare a leggere.</div>
            <div id="nav-buttons">
                <button id="btn-prev" class="nav-action" onclick="prevChapter()" disabled>Precedente</button>
                <button id="btn-next" class="nav-action" onclick="nextChapter()" disabled>Successivo</button>
            </div>
        </div>
    </div>

    <button id="floating-print-btn" onclick="printChapter()" title="Stampa questo capitolo" style="display: none;">🖨️</button>

    <div id="searchModal">
        <div class="search-panel">
            <div class="close-search" onclick="closeSearch()">✕</div>
            <h2 style="margin-top:0; color:#8b0000; text-align:center;">Ricerca nei Quaderni 1944</h2>
            
            <div class="search-section">
                <span class="search-title">Tipo di ricerca:</span>
                <div style="margin-bottom:10px;">
                    <label style="margin-right:12px; cursor:pointer;"><input type="radio" name="localType" value="simple_partial" checked onchange="toggleLocalMode()"> Semplice Parziale</label>
                    <label style="margin-right:12px; cursor:pointer;"><input type="radio" name="localType" value="simple_exact" onchange="toggleLocalMode()"> Semplice Esatta</label>
                    <label style="margin-right:12px; cursor:pointer;"><input type="radio" name="localType" value="or_exact" onchange="toggleLocalMode()"> Multipla Esatta</label>
                    <label style="cursor:pointer;"><input type="radio" name="localType" value="proximity" onchange="toggleLocalMode()"> Concordanze</label>
                </div>
                <div id="localSimpleBox" class="input-group">
                    <input type="text" id="simpleInput" placeholder="Es. Guerra...">
                    <button class="btn-search" onclick="doSimpleSearch()">Cerca</button>
                </div>
                <div id="localOrBox" class="input-group" style="display:none;">
                    <input type="text" id="orWord1" placeholder="Parola 1">
                    <strong style="align-self:center; color:#8b0000;">OPPURE</strong>
                    <input type="text" id="orWord2" placeholder="Parola 2">
                    <button class="btn-search" onclick="doSimpleSearch()">Cerca</button>
                </div>
            </div>

            <div id="localProximitySection" class="search-section" style="border-bottom:none; margin-bottom:5px; display:none;">
                <span class="search-title">Ricerca per Concordanze (vicinanza)</span>
                <div class="input-group">
                    <input type="text" id="word1" placeholder="Parola 1">
                    <input type="number" id="distance" value="20" style="width:60px;" title="Distanza max parole">
                    <input type="text" id="word2" placeholder="Parola 2">
                    <button class="btn-search" onclick="doProximitySearch()">Trova</button>
                </div>
                <div style="font-size:0.8em; color:#666; margin-top:5px;">Trova due parole distanti al massimo N parole l'una dall'altra.</div>
            </div>
            
            <div style="text-align:right; margin-bottom:5px;">
                <button class="btn-reset" onclick="resetSearch()">🗑️ Pulisci Tutto</button>
            </div>

            <div id="searchResults"></div>
        </div>
    </div>
    <script src="../cronologia.js"></script>
    <script src="archivio_1944.js"></script>
    <script>
        let currentIndex = -1;
        const listElement = document.getElementById('chapter-list');
        const textContainer = document.getElementById('text-container');
        const floatingPrintBtn = document.getElementById('floating-print-btn');
        
        let searchKeywords = []; 
        let isSearchActive = false; 
        let searchIsPartial = false; // true solo per ricerca parziale da URL

        if (typeof quaderni_1944 !== 'undefined') {
            initMenu();
            loadChapter(0);
        } else {
            textContainer.innerHTML = "<p style='color:red'>Errore: Variabile 'quaderni_1944' non trovata.</p>";

            setTimeout(() => {
                if (typeof window.ripristinaEvidenze === 'function') window.ripristinaEvidenze();
            }, 100);
        }

        function initMenu() {
            quaderni_1944.forEach((cap, index) => {
                const li = document.createElement('li');
                li.className = 'chapter-item';
                li.id = 'item-' + index;

                // --- STILE TITOLO + DATA A CAPO ---
                let titoloPrincipale = "Quaderni 1944";
                let dataFinale = cap.data || "";

                li.innerHTML = `<strong>${titoloPrincipale}</strong><span class="chapter-date">${dataFinale}</span>`;
                
                li.onclick = () => {
                    searchKeywords = []; 
                    isSearchActive = false;
                    document.getElementById('btn-back-search').style.display = 'none';
                    loadChapter(index);
                };
                listElement.appendChild(li);
            });
        }

        function loadChapter(index, autoScroll = false) {
            currentIndex = index;
            const cap = quaderni_1944[index];
            
            let content = cap.testo;
            
            // --- SALVATAGGIO IN CRONOLOGIA ---
            if (typeof salvaInCronologia === "function") {
                let dataFinale = cap.data || ("Capitolo " + index);
                let titoloCronologia = "1944 - " + dataFinale; // Titolo personalizzato 1944
                
                // Salvataggio con URL specifico per il 1944
                salvaInCronologia(index, titoloCronologia, "I Quaderni", "Quaderni", "/quaderni_1944.html?idx=");
            }
            // ---------------------------------

            // EVIDENZIAZIONE
            if (searchKeywords.length > 0) {
                content = highlightText(content, searchKeywords, searchIsPartial);
            }

            const cp = `<div class="copyright-text"><br>Tutti i documenti sono tratti scrupolosamente dalle Opere delle ultime edizioni del Centro Editoriale Valtortiano (CEV)<br>Tutti i diritti d’autore sono riservati alla Fondazione Maria Valtorta CEV onlus<br>info@valtortamaria.com</div>`;
            const lnk = cap.link || cap.url || "http://www.valtortamaria.com";
            const lh = `<div class="source-link"><a href="${lnk}" target="_blank">Leggi il capitolo originale sul sito</a></div>`;
            
            textContainer.innerHTML = `${content}<div class="chapter-footer">${cp}${lh}</div>`;

            setTimeout(() => {
                if (typeof window.ripristinaEvidenze === 'function') window.ripristinaEvidenze();
            }, 100);
            
            document.querySelectorAll('.chapter-item').forEach(el => el.classList.remove('active'));
            const activeItem = document.getElementById('item-' + index);
            if(activeItem) { activeItem.classList.add('active'); activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
            updateButtons();

            // Mostriamo il tasto stampa fluttuante
            floatingPrintBtn.style.display = 'flex';

            // --- GESTIONE DELLO SCROLL (Nuova) ---
            let posizioni = JSON.parse(localStorage.getItem('valtorta_scroll_posizioni')) || {};
            const chiave = "quaderni_1944_" + index; // Chiave univoca 1944

            if (autoScroll && searchKeywords.length > 0) {
                document.getElementById('main-content').scrollTop = 0;
                setTimeout(() => {
                    const mark = document.querySelector('mark.highlight');
                    if(mark) mark.scrollIntoView({ behavior: "smooth", block: "center" });
                }, 300);
            } else if (posizioni[chiave]) {
                setTimeout(() => {
                    const mainArea = document.getElementById('main-content');
                    if (mainArea) {
                        mainArea.scrollTo({ top: posizioni[chiave], behavior: 'smooth' });
                    }
                }, 300);
            } else {
                document.getElementById('main-content').scrollTop = 0;
            }
        }

        function highlightText(html, keywords, partial = false) {
            let pattern = keywords.map(k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');
            if(!pattern) return html;
            let regex;
            if (partial) {
                // Parziale: evidenzia anche dentro altre parole
                regex = new RegExp('(' + pattern + ')', 'gi');
            } else {
                // Esatta: \p{L} per confini di parola Unicode (evita benedice, giudice ecc.)
                regex = new RegExp('(?<!\\p{L})(' + pattern + ')(?!\\p{L})', 'giu');
            }
            return html.replace(/(<[^>]+>)|([^<]+)/g, (m, tag, text) => {
                if (tag) return tag;
                return text.replace(regex, '<mark class="highlight">$&</mark>');
            });
        }

        function nextChapter() { if (currentIndex < quaderni_1944.length - 1) loadChapter(currentIndex + 1); }
        function prevChapter() { if (currentIndex > 0) loadChapter(currentIndex - 1); }
        function updateButtons() {
            document.getElementById('btn-prev').disabled = (currentIndex === 0);
            document.getElementById('btn-next').disabled = (currentIndex === quaderni_1944.length - 1);
        }

        // --- MOTORE DI RICERCA ---
        
        function openSearch() { 
            document.getElementById('searchModal').style.display = 'flex'; 
            document.getElementById('simpleInput').focus(); 
            document.getElementById('btn-back-search').style.display = 'none';
            // Nascondiamo il bottone stampa fluttuante quando si apre la ricerca
            floatingPrintBtn.style.display = 'none';
        }
        
        function closeSearch() { 
            document.getElementById('searchModal').style.display = 'none';
            if(isSearchActive) document.getElementById('btn-back-search').style.display = 'block';

            // Rimostriamo il bottone di stampa se c'è un capitolo caricato
            if (currentIndex > -1) {
                floatingPrintBtn.style.display = 'flex';
            }
        }

        function resetSearch() {
            document.getElementById('simpleInput').value = "";
            document.getElementById('word1').value = "";
            document.getElementById('word2').value = "";
            document.getElementById('distance').value = "20";
            document.getElementById('searchResults').innerHTML = "";
            document.getElementById('simpleInput').focus();
        }
        
        document.getElementById('searchModal').addEventListener('click', function(e) {
            if (e.target === this) closeSearch();
        });

        function toggleLocalMode() {
            const type = document.querySelector('input[name="localType"]:checked').value;
            document.getElementById('localSimpleBox').style.display = (type === 'simple_partial' || type === 'simple_exact') ? 'flex' : 'none';
            document.getElementById('localOrBox').style.display = (type === 'or_exact') ? 'flex' : 'none';
            document.getElementById('localProximitySection').style.display = (type === 'proximity') ? 'block' : 'none';
        }

        function doSimpleSearch() {
            const type = document.querySelector('input[name="localType"]:checked').value;
            if (type === 'or_exact') {
                const w1 = document.getElementById('orWord1').value.trim();
                const w2 = document.getElementById('orWord2').value.trim();
                if (!w1 || !w2) { alert("Inserisci entrambe le parole"); return; }
                performSearch([w1, w2], "or_exact");
            } else {
                const val = document.getElementById('simpleInput').value.trim();
                if (val.length < 3) { alert("Inserisci almeno 3 caratteri"); return; }
                performSearch([val], type); // 'simple_partial' o 'simple_exact'
            }
        }

        function doProximitySearch() {
            const w1 = document.getElementById('word1').value.trim();
            const w2 = document.getElementById('word2').value.trim();
            const dist = parseInt(document.getElementById('distance').value) || 20;
            if (!w1 || !w2) { alert("Inserisci entrambe le parole"); return; }
            performSearch([w1, w2], "proximity", dist);
        }

        function performSearch(terms, type, dist = 20) {
            const resultsDiv = document.getElementById('searchResults');
            resultsDiv.innerHTML = '<div style="text-align:center; padding:10px;">Ricerca in corso...</div>';
            
            const p1 = terms[0].toLowerCase();
            const p2 = terms[1] ? terms[1].toLowerCase() : null;
            let results = [];

            quaderni_1944.forEach((cap, idx) => {
                let cleanText = (cap.testo).replace(/<[^>]+>/g, " ").replace(/&nbsp;/g, " ").toLowerCase();
                let found = false;
                let snippet = "";

                if (type === "simple_partial") {
                    // Parziale: trova anche dentro altre parole
                    if (cleanText.includes(p1)) {
                        found = true;
                        const pos = cleanText.indexOf(p1);
                        const safeP = p1.replace(/[.*+?^${}()|[\\]\\]/g, '\\$&');
                        const raw = "..." + cleanText.substring(Math.max(0, pos - 40), Math.min(cleanText.length, pos + 60)) + "...";
                        snippet = raw.replace(new RegExp(safeP, 'gi'), '<mark class="highlight">$&</mark>');
                    }
                } else if (type === "simple" || type === "simple_exact") {
                    const safeP1 = p1.replace(/[.*+?^${}()|[\\]\\]/g, '\\$&');
                    const exactRe = new RegExp('(?<!\\p{L})' + safeP1 + '(?!\\p{L})', 'iu');
                    const m = cleanText.match(exactRe);
                    if (m) {
                        found = true;
                        const pos = m.index;
                        const raw = "..." + cleanText.substring(Math.max(0, pos - 40), Math.min(cleanText.length, pos + 60)) + "...";
                        snippet = raw.replace(new RegExp('(?<!\\p{L})(' + safeP1 + ')(?!\\p{L})', 'giu'), '<mark class="highlight">$1</mark>');
                    }
                } else if (type === "or_exact") {
                    const safeP1 = p1.replace(/[.*+?^${}()|[\\]\\]/g, '\\$&');
                    const safeP2 = p2.replace(/[.*+?^${}()|[\\]\\]/g, '\\$&');
                    const exactRegex = new RegExp('(?<!\\p{L})(' + safeP1 + '|' + safeP2 + ')(?!\\p{L})', 'iu');
                    const match = cleanText.match(exactRegex);
                    if (match) {
                        found = true;
                        const pos = match.index;
                        const raw = "..." + cleanText.substring(Math.max(0, pos - 40), Math.min(cleanText.length, pos + 60)) + "...";
                        snippet = raw.replace(new RegExp('(?<!\\p{L})(' + safeP1 + '|' + safeP2 + ')(?!\\p{L})', 'giu'), '<mark class="highlight">$1</mark>');
                    }
                } else if (type === "proximity") {
                    // Concordanze: ricerca esatta con confini di parola Unicode
                    const safeP1c = p1.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\$&');
                    const safeP2c = p2 ? p2.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\$&') : '';
                    const exactRe1 = new RegExp('(?<!\p{L})' + safeP1c + '(?!\p{L})', 'iu');
                    const exactRe2 = p2 ? new RegExp('(?<!\p{L})' + safeP2c + '(?!\p{L})', 'iu') : null;
                    const hlWord = (text, word) => {
                        const safeW = word.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\$&');
                        const re = new RegExp('(?<!\p{L})(' + safeW + ')(?!\p{L})', 'giu');
                        return text.replace(re, '<mark class="highlight">$1</mark>');
                    };
                    const words = cleanText.split(/\s+/).filter(w => w.length > 0);
                    let idx1 = [], idx2 = [];
                    words.forEach((w, i) => {
                        if (exactRe1.test(w)) idx1.push(i);
                        if (exactRe2 && exactRe2.test(w)) idx2.push(i);
                    });
                    
                    if (idx1.length > 0 && idx2.length > 0) {
                        let minD = Infinity; let bestPos = 0;
                        idx1.forEach(i1 => {
                            idx2.forEach(i2 => {
                                let d = Math.abs(i1 - i2);
                                if (d < minD) { minD = d; bestPos = Math.min(i1, i2); }
                            });
                        });
                        if (minD <= dist) {
                            found = true;
                            const start = Math.max(0, bestPos - 10);
                            const end = Math.min(words.length, bestPos + dist + 10);
                            let rawSnippet = "..." + words.slice(start, end).join(" ") + "...";
                            snippet = hlWord(rawSnippet, p1);
                            if (p2) snippet = hlWord(snippet, p2);
                        }
                    }
                }

                if (found) {
                    let title = "Quaderni 1944";
                    if(cap.data) title += " - " + cap.data;
                    
                    results.push({ idx: idx, title: title, snippet: snippet });
                }
            });

            if (results.length === 0) {
                resultsDiv.innerHTML = '<div style="padding:10px; color:red;">Nessun risultato trovato.</div>';
            } else {
                // --- AGGIORNATO: CHIAMA printSearchResults() ---
                const printBtn = `<button class="btn-print-pdf" onclick="printSearchResults()" style="float:right; cursor:pointer; background:none; border:1px solid #8b0000; padding:2px 8px; border-radius:4px; color:#8b0000; font-size:0.9em;">🖨️ Stampa PDF</button>`;

                resultsDiv.innerHTML = `<div style="margin-bottom:10px; font-weight:bold; overflow:hidden;">
                    Trovati ${results.length} risultati: ${printBtn}
                </div>`;

                results.forEach(res => {
                    const div = document.createElement('div');
                    div.className = 'result-item';
                    div.innerHTML = `<div class="result-cap">${res.title}</div><div class="result-snippet">${res.snippet}</div>`;
                    
                    div.onclick = function() {
                        this.classList.add('visited');
                        isSearchActive = true;
                        searchKeywords = terms;
                        document.getElementById('btn-back-search').style.display = 'block';
                        loadChapter(res.idx, true);
                        closeSearch();
                    };
                    resultsDiv.appendChild(div);
                });
            }
        }
        
        /* --- RICEVITORE RICERCA GLOBALE --- */
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const openIdx = params.get('idx');
            const keys = params.get('keys');
            const mode = params.get('mode'); // 'partial' o 'exact'
            
            if (openIdx !== null) {
                if (keys) {
                    searchKeywords = decodeURIComponent(keys).split(',');
                    isSearchActive = true;
                    searchIsPartial = (mode === 'partial');
                    
                    const btnBack = document.getElementById('btn-back-search');
                    btnBack.style.display = 'block';
                    btnBack.innerText = "🌐 Torna alla Ricerca Globale";
                    btnBack.style.backgroundColor = "#5d4037";
                    btnBack.style.color = "#fff";
                    
                    btnBack.onclick = function() {
                        if (history.length > 1) {
                            history.back();
                        } else {
                            window.location.href = 'ricerca.html';
                        }
                    };
                }
                
                setTimeout(() => {
                    loadChapter(parseInt(openIdx), true);
                }, 100);
            }
        });

        /* --- FUNZIONI DI STAMPA INTELLIGENTI --- */
        function printChapter() {
            document.body.classList.remove('print-search-mode');
            bvPrint();
        }

        function printSearchResults() {
            const modal = document.getElementById('searchModal');
            if (modal) modal.style.display = 'block';
            document.body.classList.add('print-search-mode');
            bvPrint();
            setTimeout(() => {
                document.body.classList.remove('print-search-mode');
                if (modal) modal.style.display = 'flex';
            }, 1000);
        }
        /* --- SALVATAGGIO POSIZIONE SCORRIMENTO --- */
        const mainContentArea = document.getElementById('main-content');
        let scrollTimeout;

        if (mainContentArea) {
            mainContentArea.addEventListener('scroll', function() {
                if (typeof currentIndex !== "undefined" && currentIndex !== -1) {
                    clearTimeout(scrollTimeout);
                    scrollTimeout = setTimeout(function() {
                        let posizioni = JSON.parse(localStorage.getItem('valtorta_scroll_posizioni')) || {};
                        // Usiamo la chiave univoca per il 1944
                        const chiave = "quaderni_1944_" + currentIndex; 
                        
                        posizioni[chiave] = mainContentArea.scrollTop; 
                        localStorage.setItem('valtorta_scroll_posizioni', JSON.stringify(posizioni));
                    }, 500);
                }
            });
        }
    </script>
