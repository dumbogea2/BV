<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script>
        // Guardiano Sicuro V2
        if (window.location.hostname.includes("github.io")) {
            if (navigator.onLine) {
                document.documentElement.style.display = 'none';
            }
        }
    </script>
    <title>I miei Appunti · Studi e Approfondimenti</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            margin: 0; padding: 20px;
            background-color: #f4ece0;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            width: 100%; max-width: 800px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 3px double #8b0000; padding-bottom: 15px; margin-bottom: 30px;
            flex-wrap: wrap; gap: 15px;
        }
        .header h1 { margin: 0; color: #8b0000; font-size: 22px; }
        .header-buttons { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        
        .appunti-filter-dropdown {
            background-color: #fdfdfd; border: 1px solid #8b0000; color: #8b0000;
            padding: 8px 12px; border-radius: 4px; font-size: 0.9rem; font-weight: bold;
            cursor: pointer; font-family: inherit; outline: none; transition: all 0.2s ease;
        }
        .appunti-filter-dropdown:hover { background-color: #fcebeb; }

        .btn-back {
            text-decoration: none; background-color: #8b0000; color: white;
            padding: 8px 15px; border-radius: 4px; font-weight: bold; font-size: 14px;
            transition: 0.2s; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
        }
        .btn-back:hover { background-color: #a50000; }
        .btn-back.secondary { background-color: #887860; }
        .btn-back.secondary:hover { background-color: #5d4037; }
        
        #btn-stampa, #btn-word, #btn-toggle-tendine, #btn-svuota {
            border: none; padding: 8px 15px; border-radius: 4px; font-weight: bold; font-size: 14px;
            cursor: pointer; transition: 0.2s; display: none; align-items: center; gap: 6px;
            white-space: nowrap; font-family: inherit;
        }
        #btn-stampa { background-color: #555; color: white; }
        #btn-stampa:hover { background-color: #333; }
        #btn-word { background-color: #0056b3; color: white; }
        #btn-word:hover { background-color: #004494; }
        #btn-toggle-tendine { background-color: #d1cbb8; color: #5d4037; }
        #btn-toggle-tendine:hover { background-color: #c4bdae; }
        #btn-svuota { background-color: transparent; border: 2px solid #d32f2f; color: #d32f2f; }
        #btn-svuota:hover { background-color: #ffebee; }
        
        #appunti-container { width: 100%; max-width: 800px; }
        .book-group { margin-bottom: 20px; }
        .libro-tendina { width: 100%; }
        .book-title {
            background-color: #d1cbb8; padding: 10px 15px; border-radius: 6px;
            font-size: 18px; color: #5d4037; margin-bottom: 15px; border-left: 5px solid #8b0000;
            cursor: pointer; font-weight: bold; transition: background-color 0.2s;
        }
        .book-title:hover { background-color: #c4bdae; }
        
        .appunto-card {
            background: white; border: 1px solid #dcd8ce; border-radius: 8px;
            padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .appunto-card:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.1); }
        
        .appunto-header {
            display: flex; justify-content: space-between; font-size: 12px; color: #666;
            margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px;
        }
        .appunto-tipo { font-weight: bold; text-transform: uppercase; }
        .tipo-nota { color: #8b0000; }
        .tipo-sottolineatura { color: #0056b3; }
        
        .appunto-snippet { font-style: italic; color: #555; margin-bottom: 10px; border-left: 3px solid #ccc; padding-left: 10px; }
        .appunto-nota-testo { background-color: #fff8e1; padding: 10px; border-radius: 4px; margin-bottom: 15px; font-weight: bold; }
        
        .appunto-actions { text-align: right; }
        .btn-vai {
            background-color: #5d4037; color: white; border: none; padding: 6px 12px;
            border-radius: 4px; cursor: pointer; font-size: 12px; transition: 0.2s;
        }
        .btn-vai:hover { background-color: #8b0000; }
        .btn-elimina {
            background-color: transparent; color: #888; border: 1px solid #ccc; padding: 5px 10px;
            border-radius: 4px; cursor: pointer; font-size: 12px; margin-left: 10px; transition: 0.2s;
        }
        .btn-elimina:hover { background-color: #ffebee; color: #d32f2f; border-color: #d32f2f; }

        .empty-state { text-align: center; color: #666; font-style: italic; padding: 40px; }

        @media print {
            body { background-color: white !important; padding: 0; }
            .header-buttons, .appunto-actions, .btn-back { display: none !important; }
            .header { border-bottom: 2px solid #8b0000; }
            .appunto-card { box-shadow: none !important; border: 1px solid #ccc; page-break-inside: avoid; margin-bottom: 20px; }
            .book-title { page-break-after: avoid; background-color: #eee !important; border-left: 5px solid #8b0000 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .appunto-nota-testo { background-color: #fff8e1 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>📝 I miei Appunti<br><small style="font-size:13px; color:#998870; font-weight:normal;">Studi e Approfondimenti</small></h1>
        <div class="header-buttons">
            <a href="home.html" class="btn-back">📚 Studi</a>
            <a href="../index.html" class="btn-back secondary">🏠 Portale</a>
            
            <button id="btn-toggle-tendine" onclick="toggleTutteLeTendine()">🔽 Comprimi Tutti</button>
            <button id="btn-svuota" onclick="svuotaTuttoStudi()">🗑️ Elimina</button>
            <button id="btn-stampa" onclick="stampaPDF()">📄 PDF</button>
            <button id="btn-word" onclick="esportaWord()">📘 Word</button>
            
            <select id="filtro-appunti" class="appunti-filter-dropdown">
                <option value="all">Tutti (Note e Sottolineature)</option>
                <option value="note">📝 Solo Note Testuali</option>
                <option value="highlight">🖍️ Solo Sottolineature</option>
            </select>
        </div>
    </div>

    <div id="appunti-container"></div>

    <script>
        const isCloudMode = localStorage.getItem('modalita_lettura') === 'cloud';
        let utenteCloud = null;
        let db = null, doc = null, collection = null, getDocs = null, deleteDoc = null;

        // Predicato: appartiene alla sezione Studi e Approfondimenti?
        function isStudi(appunto) {
            return appunto && appunto.book && appunto.book.toString().startsWith('Polifonia');
        }

        if (isCloudMode) {
            (async function initFirebase() {
                try {
                    const fApp = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js");
                    const fAuth = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js");
                    const fDb = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");

                    const firebaseConfig = {
                        apiKey: "AIzaSyBHEhVjlZIs-mIPnteFiOiBgHryL1R9_Zk",
                        authDomain: "appuntivaltorta.firebaseapp.com",
                        projectId: "appuntivaltorta",
                        storageBucket: "appuntivaltorta.firebasestorage.app",
                        messagingSenderId: "940851152715",
                        appId: "1:940851152715:web:0e47bd8ca7282efac3cace"
                    };

                    const app = fApp.initializeApp(firebaseConfig);
                    const auth = fAuth.getAuth(app);
                    db = fDb.getFirestore(app);
                    doc = fDb.doc; collection = fDb.collection; getDocs = fDb.getDocs; deleteDoc = fDb.deleteDoc;

                    fAuth.onAuthStateChanged(auth, (user) => {
                        if (user) { utenteCloud = user; caricaDati(); }
                        else { window.location.href = "../login.html"; }
                    });
                } catch(e) {
                    console.warn("Cloud non disponibile, proseguo offline.");
                    caricaDati();
                }
            })();
        } else {
            window.addEventListener('load', caricaDati);
        }

        async function caricaDati() {
            let appuntiArray = [];

            if (isCloudMode) {
                if (!utenteCloud || !db) {
                    appuntiArray = JSON.parse(localStorage.getItem('valtorta_appunti')) || [];
                } else if (!navigator.onLine) {
                    appuntiArray = JSON.parse(localStorage.getItem('valtorta_appunti')) || [];
                } else {
                    try {
                        const snapshot = await getDocs(collection(db, `utenti/${utenteCloud.uid}/appunti`));
                        snapshot.forEach((d) => { appuntiArray.push(d.data()); });
                        localStorage.setItem('valtorta_appunti', JSON.stringify(appuntiArray));
                    } catch(e) {
                        appuntiArray = JSON.parse(localStorage.getItem('valtorta_appunti')) || [];
                    }
                }
            } else {
                appuntiArray = JSON.parse(localStorage.getItem('valtorta_appunti')) || [];
            }

            // FILTRO: solo Studi e Approfondimenti
            const appuntiStudi = appuntiArray.filter(isStudi);
            renderAppuntiHTML(appuntiStudi);
        }

        // Elimina singolo (questa azione su un appunto di Studi non tocca altre opere)
        window.eliminaAppunto = async function(id) {
            if(confirm("Sei sicuro di voler eliminare questo appunto?")) {
                let appunti = JSON.parse(localStorage.getItem('valtorta_appunti')) || [];
                appunti = appunti.filter(a => a.id !== id);
                localStorage.setItem('valtorta_appunti', JSON.stringify(appunti));

                if (isCloudMode && utenteCloud && db) {
                    try { await deleteDoc(doc(db, `utenti/${utenteCloud.uid}/appunti`, id)); }
                    catch(e) { console.warn("Offline: eliminato solo localmente"); }
                }
                caricaDati(); 
            }
        };

        // Svuota SOLO gli appunti degli Studi e Approfondimenti
        window.svuotaTuttoStudi = async function() {
            if(!confirm("⚠️ Sei sicuro di voler eliminare TUTTI gli appunti degli Studi e Approfondimenti?\n(Gli appunti degli altri libri non saranno toccati.)")) return;
            
            // 1. LOCALE: rimuove solo gli appunti di Studi, tiene il resto
            let appunti = JSON.parse(localStorage.getItem('valtorta_appunti')) || [];
            const daEliminareLocali = appunti.filter(isStudi);
            appunti = appunti.filter(a => !isStudi(a));
            localStorage.setItem('valtorta_appunti', JSON.stringify(appunti));
            
            // 2. CLOUD: elimina solo i documenti della sezione Studi
            if (isCloudMode && utenteCloud && db) {
                try {
                    const snapshot = await getDocs(collection(db, `utenti/${utenteCloud.uid}/appunti`));
                    const promises = [];
                    snapshot.forEach(documento => {
                        if (isStudi(documento.data())) {
                            promises.push(deleteDoc(doc(db, `utenti/${utenteCloud.uid}/appunti`, documento.id)));
                        }
                    });
                    await Promise.all(promises);
                } catch(e) { console.warn("Offline: impossibile svuotare il cloud."); }
            }
            setTimeout(caricaDati, 300);
        };

        window.toggleTutteLeTendine = function() {
            const tendine = document.querySelectorAll('.libro-tendina');
            const btn = document.getElementById('btn-toggle-tendine');
            const isComprimendo = btn.innerText.includes('Comprimi');
            tendine.forEach(t => isComprimendo ? t.removeAttribute('open') : t.setAttribute('open', ''));
            btn.innerHTML = isComprimendo ? '▶️ Espandi Tutti' : '🔽 Comprimi Tutti';
        };

        window.stampaPDF = function() { window.print(); };

        window.esportaWord = function() {
            let contenitoreClone = document.getElementById('appunti-container').cloneNode(true);
            contenitoreClone.querySelectorAll('.appunto-actions').forEach(btn => btn.remove());

            const intestazione = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Appunti Studi e Approfondimenti</title>";
            const stile = "<style>body{font-family:'Georgia',serif;color:#333;} .book-title{font-size:18pt;font-weight:bold;background-color:#d1cbb8;padding:10px;border-left:5px solid #8b0000;margin-bottom:15px;} .appunto-card{border:1px solid #ccc;padding:15px;margin-bottom:20px;} .appunto-header{font-size:10pt;color:#666;border-bottom:1px solid #eee;padding-bottom:5px;margin-bottom:10px;} .appunto-snippet{font-style:italic;color:#555;border-left:3px solid #ccc;padding-left:10px;margin-bottom:10px;} .appunto-nota-testo{background-color:#fff8e1;padding:10px;border:1px solid #ffe082;font-weight:bold;margin-bottom:10px;} .tipo-nota{color:#8b0000;font-weight:bold;} .tipo-sottolineatura{color:#0056b3;font-weight:bold;}</style></head><body>";
            const titolo = "<h1 style='color:#8b0000;text-align:center;'>I miei Appunti · Studi e Approfondimenti</h1><hr>";
            const html = intestazione + stile + titolo + contenitoreClone.innerHTML + "</body></html>";

            const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.download = `Appunti_Studi_${new Date().toISOString().split('T')[0]}.doc`;
            link.href = url;
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
            URL.revokeObjectURL(url);
        };

        function renderAppuntiHTML(appunti) {
            const container = document.getElementById('appunti-container');
            const btnSvuota = document.getElementById('btn-svuota');
            const btnStampa = document.getElementById('btn-stampa');
            const btnWord = document.getElementById('btn-word');
            const btnToggle = document.getElementById('btn-toggle-tendine');
            
            if (appunti.length === 0) {
                container.innerHTML = `<div class="empty-state">Non hai ancora salvato appunti negli Studi e Approfondimenti.<br>Apri un volume e seleziona un brano per iniziare!</div>`;
                btnSvuota.style.display = 'none'; btnStampa.style.display = 'none';
                btnWord.style.display = 'none'; btnToggle.style.display = 'none';
                return;
            }

            btnSvuota.style.display = 'inline-flex'; btnStampa.style.display = 'inline-flex';
            btnWord.style.display = 'inline-flex'; btnToggle.style.display = 'inline-flex';

            const appuntiPerLibro = appunti.reduce((acc, a) => {
                if (!acc[a.book]) acc[a.book] = [];
                acc[a.book].push(a);
                return acc;
            }, {});

            container.innerHTML = '';

            for (const [libro, lista] of Object.entries(appuntiPerLibro)) {
                let htmlGroup = `
                <div class="book-group">
                    <details class="libro-tendina" open>
                        <summary class="book-title">📖 ${libro}</summary>
                        <div class="libro-contenuto">
                `;
                
                lista.reverse().forEach(item => {
                    const isNota = item.type === 'note';
                    const tipoLabel = isNota ? '📝 Nota Personale' : '🖍️ Sottolineatura';
                    const tipoClass = isNota ? 'tipo-nota' : 'tipo-sottolineatura';
                    const notaHtml = isNota ? `<div class="appunto-nota-testo">✍️ ${item.noteText}</div>` : '';
                    
                    // Costruzione URL: gli URL della Polifonia sono tipo
                    // "PolifoniaValtortiana/polifonia.html?vi=0&type=voce&id=123"
                    // Siamo dentro PolifoniaValtortiana/, dobbiamo togliere il prefisso.
                    let linkTarget = item.url;
                    if (linkTarget.startsWith('PolifoniaValtortiana/')) {
                        linkTarget = linkTarget.substring('PolifoniaValtortiana/'.length);
                    }
                    // Aggiungi parametro appId per scrollare all'appunto specifico
                    const sep = linkTarget.includes('?') ? '&' : '?';
                    linkTarget += sep + 'appId=' + item.id;

                    htmlGroup += `
                        <div class="appunto-card" data-type="${item.type}">
                            <div class="appunto-header">
                                <span class="appunto-tipo ${tipoClass}">${tipoLabel}</span>
                                <span>${item.chapter} | 🗓️ ${item.date}</span>
                            </div>
                            <div class="appunto-snippet">"${item.snippet}..."</div>
                            ${notaHtml}
                            <div class="appunto-actions">
                                <button class="btn-elimina" onclick="eliminaAppunto('${item.id}')">🗑️ Elimina</button>
                                <button class="btn-vai" onclick="window.location.href='${linkTarget}'">Vai al Capitolo ➔</button>
                            </div>
                        </div>
                    `;
                });
                
                htmlGroup += `
                        </div>
                    </details>
                </div>`;
                
                container.innerHTML += htmlGroup;
            }

            // Riapplica il filtro selezionato
            document.getElementById('filtro-appunti').dispatchEvent(new Event('change'));
        }

        document.getElementById('filtro-appunti').addEventListener('change', function(e) {
            const filtro = e.target.value;
            const schede = document.querySelectorAll('.appunto-card');
            schede.forEach(scheda => {
                const tipo = scheda.getAttribute('data-type');
                scheda.style.display = (filtro === 'all' || filtro === tipo) ? 'block' : 'none';
            });
            // Nasconde i gruppi vuoti
            document.querySelectorAll('.book-group').forEach(gruppo => {
                const visibili = [...gruppo.querySelectorAll('.appunto-card')].filter(c => c.style.display !== 'none');
                gruppo.style.display = visibili.length === 0 ? 'none' : 'block';
            });
        });
    </script>

    <script>
        // --- CONTROLLO ACCESSO DINAMICO V2 (Anti-Crash Offline) ---
        (async function checkAuthAppuntiStudi() {
            const isOnline = window.location.hostname.includes("github.io");
            if (isOnline) {
                try {
                    const fApp = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js");
                    const fAuth = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js");

                    const firebaseConfig = {
                        apiKey: "AIzaSyBHEhVjlZIs-mIPnteFiOiBgHryL1R9_Zk",
                        authDomain: "appuntivaltorta.firebaseapp.com",
                        projectId: "appuntivaltorta",
                        storageBucket: "appuntivaltorta.firebasestorage.app",
                        messagingSenderId: "940851152715",
                        appId: "1:940851152715:web:0e47bd8ca7282efac3cace"
                    };

                    const app = fApp.getApps().length === 0 ? fApp.initializeApp(firebaseConfig) : fApp.getApp();
                    const auth = fAuth.getAuth(app);

                    fAuth.onAuthStateChanged(auth, (user) => {
                        if (user) {
                            document.documentElement.style.display = '';
                            document.body.style.display = "flex"; 
                            localStorage.setItem('modalita_lettura', 'cloud');
                        } else {
                            window.location.replace("/BV/login.html"); 
                        }
                    });
                } catch (error) {
                    console.warn("Firebase non raggiungibile.");
                    document.documentElement.style.display = '';
                    document.body.style.display = "flex";
                }
            }
        })();
    </script>
</body>
</html>
