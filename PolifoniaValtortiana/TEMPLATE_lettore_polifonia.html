<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script>
        // Guardiano Sicuro V2
        if (window.location.hostname.includes("github.io")) {
            if (navigator.onLine) {
                document.documentElement.style.display = 'none';
            }
        }
    </script>
    
    <!-- ISTRUZIONE: Cambiare il titolo con il nome del libro -->
    <title>Nome del Libro - Polifonia Valtortiana</title>
    
    <style>
        body {
            font-family: 'Georgia', serif;
            margin: 0; padding: 20px;
            background-color: #f4ece0;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            width: 100%; max-width: 800px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 3px double #8b0000; padding-bottom: 15px; margin-bottom: 30px;
            flex-wrap: wrap; gap: 10px;
        }
        .header h1 { margin: 0; color: #8b0000; font-size: 22px; }
        .btn-back {
            text-decoration: none; background-color: #8b0000; color: white;
            padding: 8px 15px; border-radius: 4px; font-weight: bold; font-size: 14px;
            transition: background 0.2s;
        }
        .btn-back:hover { background-color: #a50000; }

        /* Contenitore del testo dei capitoli */
        #modalText-polifonia {
            width: 100%; max-width: 800px;
            background: white; border: 1px solid #dcd8ce;
            border-radius: 8px; padding: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            font-size: 1.05rem; line-height: 1.8;
        }
        
        /* Stile per il titolo del capitolo */
        .polifonia-titolo-header {
            font-size: 1.3rem; font-weight: bold; color: #8b0000;
            margin-bottom: 15px; padding-bottom: 10px;
            border-bottom: 1px solid #dcd8ce;
        }

        /* Navigazione tra capitoli */
        .nav-capitoli {
            width: 100%; max-width: 800px;
            display: flex; justify-content: space-between; gap: 10px;
            margin-top: 20px; flex-wrap: wrap;
        }
        .nav-capitoli button {
            background-color: #5d4037; color: white; border: none;
            padding: 10px 20px; border-radius: 4px; cursor: pointer;
            font-weight: bold; transition: 0.2s; font-family: inherit;
        }
        .nav-capitoli button:hover { background-color: #8b0000; }
        .nav-capitoli button:disabled { background-color: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

    <!-- 
        ISTRUZIONE FONDAMENTALE: 
        L'attributo data-nome-libro è OBBLIGATORIO.
        Deve contenere il nome esatto del libro così come volete che appaia 
        nella cronologia, negli appunti e nella ricerca universale.
    -->
    <div class="header" data-nome-libro="Nome del Libro">
        <h1>Nome del Libro</h1>
        <div>
            <a href="home.html" class="btn-back">📚 Indice</a>
            <a href="../index.html" class="btn-back">🏠 Home</a>
        </div>
    </div>

    <!-- Contenitore del testo del capitolo (riconosciuto automaticamente da appunti.js) -->
    <div id="modalText-polifonia"></div>

    <!-- Navigazione tra capitoli -->
    <div class="nav-capitoli">
        <button id="btnPrev" onclick="cambiaCapitolo(-1)">← Precedente</button>
        <button id="btnNext" onclick="cambiaCapitolo(1)">Successivo →</button>
    </div>

    <!-- 
        =====================================================
        SCRIPT DA INCLUDERE (Stessa struttura dei Quaderni)
        =====================================================
    -->

    <!-- 1. ARCHIVIO DATI: Il file JS con i contenuti del libro -->
    <!--    ISTRUZIONE: Sostituire con il percorso del proprio archivio -->
    <script src="archivio_nome_libro.js"></script>

    <!-- 2. CRONOLOGIA: Salva automaticamente l'ultimo capitolo letto -->
    <script src="../cronologia.js"></script>

    <!-- 3. SINCRONIZZAZIONE CLOUD: Gestisce preferiti e segnalibri -->
    <script src="../sincronizzazione.js"></script>

    <!-- 4. APPUNTI E SOTTOLINEATURE: Evidenziatore e note -->
    <script src="../appunti.js"></script>

    <script>
        // =====================================================
        // LOGICA LETTORE (Adattare al proprio archivio JS)
        // =====================================================
        
        // ISTRUZIONE: Sostituire 'nomeVariabileArchivio' con il nome della variabile
        // definita nel file archivio_nome_libro.js (es: const polifonia_libro1 = [...])
        const datiLibro = (typeof nomeVariabileArchivio !== 'undefined') ? nomeVariabileArchivio : [];
        
        // Indice del capitolo attualmente visualizzato (usato da appunti.js e cronologia.js)
        let currentIndex = 0;
        
        // Legge il parametro ?idx= dall'URL (per i link dalla cronologia/appunti/ricerca)
        const params = new URLSearchParams(window.location.search);
        if (params.get('idx')) {
            currentIndex = parseInt(params.get('idx')) || 0;
        }

        function caricaCapitolo(idx) {
            if (idx < 0 || idx >= datiLibro.length) return;
            currentIndex = idx;
            
            const cap = datiLibro[idx];
            const container = document.getElementById('modalText-polifonia');
            
            // ISTRUZIONE: Adattare in base alla struttura del proprio archivio JS.
            // Se i capitoli hanno campi diversi (es: cap.html, cap.contenuto, cap.text), 
            // modificare di conseguenza.
            let titoloHTML = '';
            if (cap.titolo) {
                titoloHTML = `<div class="polifonia-titolo-header">${cap.lezione ? cap.lezione + ' - ' : ''}${cap.titolo}</div>`;
            }
            container.innerHTML = titoloHTML + (cap.testo || cap.contenuto || cap.html || cap.text || "");
            
            // Aggiorna navigazione
            document.getElementById('btnPrev').disabled = (idx <= 0);
            document.getElementById('btnNext').disabled = (idx >= datiLibro.length - 1);
            
            // Scrolla in cima
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            // --- CRONOLOGIA: Registra il capitolo letto ---
            // ISTRUZIONE: Cambiare "Nome del Libro" e "PolifoniaValtortiana" se necessario
            const titoloBreve = cap.titolo || cap.lezione || ("Capitolo " + (idx + 1));
            salvaInCronologia(idx, titoloBreve, "Nome del Libro", "PolifoniaValtortiana", "/pagina_libro.html?idx=");
            
            // --- APPUNTI: Ripristina evidenze e sottolineature salvate ---
            if (typeof window.ripristinaEvidenze === 'function') {
                setTimeout(window.ripristinaEvidenze, 500);
            }
            
            // --- SCROLL: Ripristina la posizione di lettura ---
            if (typeof ripristinaPosizioneScroll === 'function') {
                ripristinaPosizioneScroll(idx, "PolifoniaValtortiana");
            }

            // --- EVIDENZIAZIONE PAROLE DALLA RICERCA UNIVERSALE ---
            const keys = params.get('keys');
            const mode = params.get('mode');
            if (keys) {
                setTimeout(() => {
                    const parole = decodeURIComponent(keys).split(',');
                    const containerEl = document.getElementById('modalText-polifonia');
                    let html = containerEl.innerHTML;
                    parole.forEach(parola => {
                        const safe = parola.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
                        let regex;
                        if (mode === 'partial') {
                            regex = new RegExp('(' + safe + ')', 'gi');
                        } else {
                            regex = new RegExp('(?<!\\p{L})(' + safe + ')(?!\\p{L})', 'giu');
                        }
                        html = html.replace(regex, '<mark style="background:#fff3cd;padding:1px 3px;border-radius:2px;font-weight:bold;">$1</mark>');
                    });
                    containerEl.innerHTML = html;
                }, 300);
            }
        }

        function cambiaCapitolo(direzione) {
            // Salva la posizione di scroll prima di cambiare
            if (typeof salvaPosizioneScroll === 'function') {
                salvaPosizioneScroll(currentIndex, "PolifoniaValtortiana");
            }
            caricaCapitolo(currentIndex + direzione);
        }

        // Salva lo scroll quando l'utente lascia la pagina
        window.addEventListener('beforeunload', () => {
            if (typeof salvaPosizioneScroll === 'function') {
                salvaPosizioneScroll(currentIndex, "PolifoniaValtortiana");
            }
        });

        // Carica il capitolo iniziale
        if (datiLibro.length > 0) {
            caricaCapitolo(currentIndex);
        } else {
            document.getElementById('modalText-polifonia').innerHTML = 
                '<p style="text-align:center;color:#888;font-style:italic;">Nessun contenuto disponibile.</p>';
        }
    </script>

    <!-- CONTROLLO ACCESSO DINAMICO V2 (Anti-Crash Offline) -->
    <script>
        (async function checkAuthPolifonia() {
            const isOnline = window.location.hostname.includes("github.io");

            if (isOnline) {
                try {
                    const fApp = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js");
                    const fAuth = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js");

                    const firebaseConfig = {
                        apiKey: "AIzaSyBHEhVjlZIs-mIPnteFiOiBgHryL1R9_Zk",
                        authDomain: "appuntivaltorta.firebaseapp.com",
                        projectId: "appuntivaltorta",
                        storageBucket: "appuntivaltorta.firebasestorage.app",
                        messagingSenderId: "940851152715",
                        appId: "1:940851152715:web:0e47bd8ca7282efac3cace"
                    };

                    const app = fApp.getApps().length === 0 ? fApp.initializeApp(firebaseConfig) : fApp.getApp();
                    const auth = fAuth.getAuth(app);

                    fAuth.onAuthStateChanged(auth, (user) => {
                        if (user) {
                            document.documentElement.style.display = '';
                            document.body.style.display = "flex"; 
                            localStorage.setItem('modalita_lettura', 'cloud');
                        } else {
                            window.location.replace("/BV/login.html"); 
                        }
                    });
                } catch (error) {
                    console.warn("Firebase non raggiungibile. Modalità offline attiva.");
                    document.documentElement.style.display = '';
                    document.body.style.display = "flex";
                }
            }
        })();
    </script>
</body>
</html>
