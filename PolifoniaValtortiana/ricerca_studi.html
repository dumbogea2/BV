<head>

    <title>Ricerca nei Volumi Studi e Approfondimenti</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            margin: 0; padding: 20px;
            background-color: #2e1a05;
            color: #333;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }

        .nav-links {
            display: flex; justify-content: center; flex-wrap: wrap;
            width: 100%; max-width: 900px; margin-bottom: 15px; gap: 20px;
        }
        .back-link { 
            color: #d4af37; text-decoration: none; font-weight: bold; 
            transition: color 0.2s; text-align: center;
        }
        .back-link:hover { color: #fff; }

        .search-container {
            background-color: #f4ece0;
            max-width: 800px; width: 100%;
            padding: 30px; border-radius: 8px;
            border: 4px double #8b0000;
            box-shadow: 0 0 40px rgba(0,0,0,0.7);
            position: relative; 
            box-sizing: border-box;
        }
        h1 { text-align: center; color: #8b0000; margin-top: 0; border-bottom: 2px solid #dcd8ce; padding-bottom: 20px; font-size: 1.6em; }

        .close-search {
            position: absolute; top: 10px; right: 20px;
            font-size: 30px; cursor: pointer; color: #8b0000;
            font-weight: bold; line-height: 1; transition: transform 0.2s;
        }
        .close-search:hover { color: #d4af37; transform: scale(1.2); }

        .input-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        input[type="text"], input[type="number"] {
            padding: 12px; border: 2px solid #8b0000; border-radius: 4px; 
            flex-grow: 1; font-family: 'Georgia', serif; font-size: 16px;
        }
        .btn-search {
            background-color: #8b0000; color: white; border: none; padding: 10px 25px; 
            border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s;
        }
        .btn-search:hover { background-color: #a50000; transform: scale(1.05); }

        .search-options { background: #e8e4db; padding: 15px; border-radius: 4px; margin-bottom: 20px; border: 1px solid #ccc; }
        .radio-group { margin-bottom: 10px; }
        label { margin-right: 15px; cursor: pointer; font-size: 0.95em; }

        #globalResults { margin-top: 20px; }
        .book-section { margin-bottom: 30px; }

        .book-title { 
            font-size: 1.2em; color: #fff; background-color: #5d4037; 
            padding: 8px 15px; border-radius: 4px; margin-bottom: 0; 
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
            user-select: none;
        }
        .book-title:hover { background-color: #6d4c41; }
        .book-title .toggle-arrow { font-size: 0.8em; margin-left: 10px; transition: transform 0.2s; }
        .book-title.collapsed .toggle-arrow { transform: rotate(-90deg); }
        .book-results { overflow: hidden; transition: max-height 0.3s ease; margin-bottom: 10px; }
        .book-results.collapsed { display: none; }

        /* Pulsante Comprimi/Espandi tutti */
        #btn-toggle-tutti {
            background-color: #d1cbb8; border: none; color: #5d4037;
            padding: 6px 12px; border-radius: 4px; font-weight: bold; font-size: 0.9em;
            cursor: pointer; transition: 0.2s;
            display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
            margin-left: 15px;
        }
        #btn-toggle-tutti:hover { background-color: #c4bdae; }
        @media print { #btn-toggle-tutti { display: none !important; } }
        
        .result-item {
            background: white; border-bottom: 1px solid #dcd8ce; padding: 15px; 
            cursor: pointer; transition: background 0.2s;
        }
        .result-item:first-child { border-top-left-radius: 4px; border-top-right-radius: 4px; }
        .result-item:last-child { border-bottom: none; border-bottom-left-radius: 4px; border-bottom-right-radius: 4px; }
        .result-item:hover { background-color: #fff8e1; border-left: 5px solid #d4af37; padding-left: 10px; }
        
        .result-item.visited { 
            background-color: #e0d8cc; 
            border-left: 8px solid #5d4037; 
            opacity: 0.8; 
        }
        .result-item.visited .res-cap { color: #5d4037; text-decoration: line-through; text-decoration-color: rgba(0,0,0,0.2); }

        .res-cap { font-weight: bold; color: #8b0000; font-size: 1.05em; }
        .res-snippet { font-style: italic; color: #555; margin-top: 5px; line-height: 1.5; }
        #loading { display: none; text-align: center; font-size: 1.2em; color: #8b0000; font-weight: bold; padding: 20px; }

        .clear-history { float: right; font-size: 0.8em; color: #666; cursor: pointer; text-decoration: underline; margin-top: 5px; }

        @media (max-width: 600px) {
            .nav-links { flex-direction: column; align-items: center; gap: 10px; }
            .input-group { flex-direction: column; }
            .btn-search { width: 100%; }
            .search-container { padding: 20px 15px; }
            h1 { font-size: 1.3em; }
        }

        @media print {
            body { background-color: white !important; color: black !important; height: auto !important; overflow: visible !important; }
            .nav-links, .search-options, .input-group, #loading, .btn-print-pdf, .btn-print-results, #btn-print-results, .close-search { display: none !important; }
            .search-container { border: none !important; box-shadow: none !important; width: 100% !important; max-width: none !important; margin: 0 !important; padding: 0 !important; background: white !important; }
            #globalResults { display: block !important; }
            .result-item.visited { border-left-color: #555 !important; background-color: #eee !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .book-title { background-color: #333 !important; color: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>

        <h1>Ricerca nei Volumi Studi e Approfondimenti</h1>

        <div class="search-options">

                <label><input type="radio" name="searchType" value="simple" checked onclick="toggleMode()"> Semplice Parziale</label>

    <script>
        // Funzione helper: appiattisce un volume Polifonia (oggetto con .capitoliIniziali, .guide, .capitoliFinali, .lettere[].voci)
        // in un array unico ricercabile. Ogni voce mantiene i suoi campi originali.
        function appiattisciVolumePolifonia(vol) {
            if (!vol) return [];
            return [
                ...(vol.capitoliIniziali || []),
                ...(vol.guide || []),
                ...(vol.capitoliFinali || []),
                ...(vol.lettere || []).flatMap(l => l.voci || [])
            ];
        }

        // Funzione helper: appiattisce un volume Madonna Roschini
        // (oggetto con .capitoliIniziali e .parti[].sezioni) in un array unico ricercabile.
        // Aggiunge il campo `lezione` (usato come titolo) e `_parteTitolo` per contesto.
        function appiattisciVolumeMadonna(vol) {
            if (!vol) return [];
            const flat = [];
            (vol.capitoliIniziali || []).forEach(cap => {
                flat.push({ lezione: cap.titolo, testo: cap.testo, _parteTitolo: 'Premesse' });
            });
            (vol.parti || []).forEach(parte => {
                (parte.sezioni || []).forEach(sez => {
                    flat.push({ lezione: sez.lezione, testo: sez.testo, _parteTitolo: parte.titolo });
                });
            });
            return flat;
        }

        // LIBRARY dei volumi della sezione Studi e Approfondimenti.
        // I file path includono ?vi=N per distinguere i volumi nella stessa pagina lettore.
        // Per aggiungere un nuovo libro, includere il suo archivio JS sopra e aggiungere una riga qui.
        const LIBRARY = [
            { id: 'polifonia_v1', name: "Polifonia Valtortiana — Vol. 1 (A–G)",
              data: (typeof polifonia_v1 !== 'undefined' ? appiattisciVolumePolifonia(polifonia_v1) : []),
              file: 'polifonia.html?vi=0' },
            { id: 'polifonia_v2', name: "Polifonia Valtortiana — Vol. 2 (H–Z)",
              data: (typeof polifonia_v2 !== 'undefined' ? appiattisciVolumePolifonia(polifonia_v2) : []),
              file: 'polifonia.html?vi=1' },
            { id: 'madonna_roschini', name: "La Madonna negli scritti di Maria Valtorta — Roschini",
              data: (typeof madonna_roschini !== 'undefined' ? appiattisciVolumeMadonna(madonna_roschini) : []),
              file: 'madonna_roschini.html' }
        ];

        window.addEventListener('pageshow', () => {
            const savedSearch = sessionStorage.getItem('studiSearch');
            if (savedSearch) {
                const data = JSON.parse(savedSearch);
                if (data.type === 'simple') {
                    document.querySelector('input[value="simple"]').checked = true;
                    document.getElementById('simpleInput').value = data.terms[0] || "";
                } else if (data.type === 'simple_exact') {
                    document.querySelector('input[value="simple_exact"]').checked = true;
                    document.getElementById('simpleInput').value = data.terms[0] || "";
                } else if (data.type === 'or_exact') {
                    document.querySelector('input[value="or_exact"]').checked = true;
                    document.getElementById('orWord1').value = data.terms[0] || "";
                    document.getElementById('orWord2').value = data.terms[1] || "";
                } else {
                    document.querySelector('input[value="proximity"]').checked = true;
                    document.getElementById('word1').value = data.terms[0] || "";
                    document.getElementById('word2').value = data.terms[1] || "";
                    document.getElementById('distance').value = data.dist || 30;
                }
                toggleMode();
                performSearchLogic(data.terms, data.type, data.dist);
            }
        });

        function clearSearchHistory() {
            sessionStorage.removeItem('studiSearch');
            sessionStorage.removeItem('studiVisitedItems');
            document.getElementById('simpleInput').value = "";
            document.getElementById('orWord1').value = "";
            document.getElementById('orWord2').value = "";
            document.getElementById('word1').value = "";
            document.getElementById('word2').value = "";
            document.getElementById('globalResults').innerHTML = "";
        }

        function toggleMode() {
            const type = document.querySelector('input[name="searchType"]:checked').value;
            document.getElementById('simpleBox').style.display = (type === 'simple' || type === 'simple_exact') ? 'flex' : 'none';
            document.getElementById('orBox').style.display = (type === 'or_exact') ? 'flex' : 'none';
            document.getElementById('proximityBox').style.display = (type === 'proximity') ? 'flex' : 'none';
        }

        function handleEnter(e) { if (e.key === 'Enter') startSearch(); }

        function startSearch() {
            const type = document.querySelector('input[name="searchType"]:checked').value;
            let terms = [];
            let dist = 30;

            if (type === 'simple' || type === 'simple_exact') {
                const val = document.getElementById('simpleInput').value.trim();
                if (val.length < 3) { alert("Inserisci almeno 3 lettere."); return; }
                terms = [val];
            } else if (type === 'or_exact') {
                const w1 = document.getElementById('orWord1').value.trim();
                const w2 = document.getElementById('orWord2').value.trim();
                if (!w1 || !w2) { alert("Inserisci entrambe le parole."); return; }
                terms = [w1, w2];
            } else {
                const w1 = document.getElementById('word1').value.trim();
                const w2 = document.getElementById('word2').value.trim();
                dist = parseInt(document.getElementById('distance').value) || 30;
                if (!w1 || !w2) { alert("Inserisci entrambe le parole."); return; }
                terms = [w1, w2];
            }

            sessionStorage.setItem('studiSearch', JSON.stringify({ type, terms, dist }));
            performSearchLogic(terms, type, dist);
        }

        function visitAndGo(link, uniqueId, element) {
            element.classList.add('visited');
            let visited = JSON.parse(sessionStorage.getItem('studiVisitedItems') || '[]');
            if (!visited.includes(uniqueId)) {
                visited.push(uniqueId);
                sessionStorage.setItem('studiVisitedItems', JSON.stringify(visited));
            }
            window.location.href = link;
        }

        function toggleBook(titleEl) {
            const results = titleEl.nextElementSibling;
            titleEl.classList.toggle('collapsed');
            results.classList.toggle('collapsed');
        }

        function toggleAllBooks() {
            const btn = document.getElementById('btn-toggle-tutti');
            if (!btn) return;
            const isComprimendo = btn.innerText.includes('Comprimi');
            document.querySelectorAll('.book-title').forEach(el => {
                if (isComprimendo) el.classList.add('collapsed');
                else el.classList.remove('collapsed');
            });
            document.querySelectorAll('.book-results').forEach(el => {
                if (isComprimendo) el.classList.add('collapsed');
                else el.classList.remove('collapsed');
            });
            btn.innerText = isComprimendo ? '▶️ Espandi Tutti' : '🔽 Comprimi Tutti';
        }

        function performSearchLogic(terms, type, dist) {
            const resContainer = document.getElementById('globalResults');
            const loader = document.getElementById('loading');
            const visitedItems = JSON.parse(sessionStorage.getItem('studiVisitedItems') || '[]');

            resContainer.innerHTML = "";
            loader.style.display = "block";

            setTimeout(() => {
                let totalFound = 0;
                let htmlOutput = "";

                LIBRARY.forEach(book => {
                    if (!book.data || book.data.length === 0) return;
                    const bookResults = searchInBook(book.data, terms, type, dist);
                    
                    if (bookResults.length > 0) {
                        totalFound += bookResults.length;
                        htmlOutput += `<div class="book-section">`;
                        htmlOutput += `<div class="book-title" onclick="toggleBook(this)">${book.name} (${bookResults.length}) <span class="toggle-arrow">▼</span></div>`;
                        htmlOutput += `<div class="book-results">`;
                        bookResults.forEach(res => {
                            const keywordsSafe = encodeURIComponent(terms.join(','));
                            const modeParam = (type === 'simple') ? '&mode=partial' : '&mode=exact';
                            // book.file contiene già ?vi=N → useremo & per concatenare
                            const separator = book.file.includes('?') ? '&' : '?';
                            const link = `${book.file}${separator}idx=${res.idx}&keys=${keywordsSafe}&from=studi${modeParam}`;
                            const uniqueId = book.id + '-' + res.idx;
                            const isVisited = visitedItems.includes(uniqueId);
                            const visitedClass = isVisited ? ' visited' : '';

                            htmlOutput += `
                            <div class="result-item${visitedClass}" onclick="visitAndGo('${link}', '${uniqueId}', this)">
                                <div class="res-cap">${res.title}</div>
                                <div class="res-snippet">${res.snippet}</div>
                            </div>`;
                        });
                        htmlOutput += `</div></div>`;
                    }
                });

                loader.style.display = "none";

                if (totalFound === 0) {
                    resContainer.innerHTML = "<p style='text-align:center; font-style:italic;'>Nessun risultato trovato nei volumi della sezione Studi.</p>";
                    const pb = document.getElementById('btn-print-results');
                    if (pb) pb.style.display = 'none';
                } else {
                    const toggleAllBtn = `<button id="btn-toggle-tutti" onclick="toggleAllBooks()">🔽 Comprimi Tutti</button>`;
                    resContainer.innerHTML = `<div style="text-align:center; margin-bottom:20px; color:#666;">
                        Trovati <b>${totalFound}</b> risultati totali. ${toggleAllBtn}
                    </div>` + htmlOutput;
                    const pb = document.getElementById('btn-print-results');
                    if (pb) pb.style.display = '';
                }
            }, 50);
        }

        function searchInBook(data, terms, type, dist) {
            const results = [];
            const p1 = terms[0].toLowerCase();
            const p2 = terms[1] ? terms[1].toLowerCase() : null;

            data.forEach((cap, idx) => {
                if (!cap || !cap.testo) return;
                let cleanText = cap.testo
                    .replace(/<[^>]+>/g, " ")
                    .replace(/&nbsp;/g, " ")
                    .replace(/&[a-z]+;/gi, " ")
                    .replace(/&#\d+;/g, " ")
                    .replace(/\s+/g, " ")
                    .toLowerCase();
                let found = false;
                let snippet = "";

                if (type === 'simple') {
                    if (cleanText.includes(p1)) {
                        found = true;
                        const pos = cleanText.indexOf(p1);
                        const raw = "..." + cleanText.substring(Math.max(0, pos - 40), Math.min(cleanText.length, pos + 60)) + "...";
                        const safeP = p1.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                        snippet = raw.replace(new RegExp(safeP, 'gi'), '<strong style="color:#8b0000;">$&</strong>');
                    }
                } else if (type === 'simple_exact') {
                    const safeP1 = p1.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
                    const exactRegex = new RegExp('(?<!\\p{L})' + safeP1 + '(?!\\p{L})', 'iu');
                    const match = cleanText.match(exactRegex);
                    if (match) {
                        found = true;
                        const pos = match.index;
                        const raw = "..." + cleanText.substring(Math.max(0, pos - 40), Math.min(cleanText.length, pos + 60)) + "...";
                        snippet = raw.replace(new RegExp('(?<!\\p{L})(' + safeP1 + ')(?!\\p{L})', 'giu'), '<strong style="color:#8b0000;">$1</strong>');
                    }
                } else if (type === 'or_exact') {
                    const safeP1 = p1.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
                    const safeP2 = p2.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
                    const exactRegex = new RegExp('(?<!\\p{L})(' + safeP1 + '|' + safeP2 + ')(?!\\p{L})', 'iu');
                    const match = cleanText.match(exactRegex);
                    if (match) {
                        found = true;
                        const pos = match.index;
                        const raw = "..." + cleanText.substring(Math.max(0, pos - 40), Math.min(cleanText.length, pos + 60)) + "...";
                        snippet = raw.replace(new RegExp('(?<!\\p{L})(' + safeP1 + '|' + safeP2 + ')(?!\\p{L})', 'giu'), '<strong style="color:#8b0000;">$1</strong>');
                    }
                } else {
                    // Concordanze
                    const safeP1c = p1.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
                    const safeP2c = p2.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
                    const exactRe1 = new RegExp('(?<!\\p{L})' + safeP1c + '(?!\\p{L})', 'iu');
                    const exactRe2 = new RegExp('(?<!\\p{L})' + safeP2c + '(?!\\p{L})', 'iu');
                    const highlightWordC = (text, word) => {
                        const safeW = word.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
                        const re = new RegExp('(?<!\\p{L})(' + safeW + ')(?!\\p{L})', 'giu');
                        return text.replace(re, '<strong style="color:#8b0000;background:#fff3cd;padding:0 2px;">$1</strong>');
                    };
                    const words = cleanText.split(/\s+/).filter(w => w.length > 0);
                    let idx1 = [], idx2 = [];
                    words.forEach((w, i) => {
                        if (exactRe1.test(w)) idx1.push(i);
                        if (exactRe2.test(w)) idx2.push(i);
                    });
                    
                    if (idx1.length > 0 && idx2.length > 0) {
                        let minD = Infinity; let bestPos = 0;
                        idx1.forEach(i1 => {
                            idx2.forEach(i2 => {
                                const d = Math.abs(i1 - i2);
                                if (d < minD) { minD = d; bestPos = Math.min(i1, i2); }
                            });
                        });
                        if (minD <= dist) {
                            found = true;
                            const start = Math.max(0, bestPos - 10);
                            const end = Math.min(words.length, bestPos + dist + 10);
                            let rawSnippet = "..." + words.slice(start, end).join(" ") + "...";
                            snippet = highlightWordC(rawSnippet, p1);
                            snippet = highlightWordC(snippet, p2);
                        }
                    }
                }

                if (found) {
                    // Titolo: la Polifonia ha `voce` (voci dizionario) o `titolo` (capitoli);
                    // la Madonna usa `lezione`. Fallback a "Sezione N".
                    let title = "";
                    if (cap.voce) {
                        title = cap.voce;
                    } else if (cap.lezione) {
                        title = cap.lezione;
                        // aggiungi contesto parte se disponibile
                        if (cap._parteTitolo) title = `<span style="font-size:0.82em;color:#888;">${cap._parteTitolo}</span> — ${title}`;
                    } else if (cap.titolo) {
                        title = cap.titolo;
                    } else {
                        title = "Sezione " + (idx + 1);
                    }
                    results.push({ idx: idx, title: title, snippet: snippet });
                }
            });
            return results;
        }
    </script>
