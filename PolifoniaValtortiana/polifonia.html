<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Bibliotheca Valtortiana – Polifonia Valtortiana</title>
<style>
  :root { --bg:#f8f5ee; --ink:#2c2317; --accent:#7a4422; --soft:#e9e2d0;
          --sidebar-w:280px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Georgia, "Times New Roman", serif;
         background: var(--bg); color: var(--ink); line-height: 1.6; }

  /* ---------- LAYOUT ---------- */
  .layout { display: grid; grid-template-columns: var(--sidebar-w) 1fr;
            min-height: 100vh; }
  aside { background: var(--soft); padding: 16px; overflow-y: auto;
          height: 100vh; position: sticky; top: 0;
          border-right: 1px solid #d4cdb8; }
  main  { padding: 32px 40px; max-width: 820px; overflow-x: hidden; }

  /* ---------- HOME BUTTON ---------- */
  .home-btn { display: block; width: 100%; padding: 10px; margin-bottom: 14px;
              background: var(--accent); color: #fff; border: none;
              border-radius: 6px; font-family: inherit; font-size: 15px;
              font-weight: bold; cursor: pointer; letter-spacing: .4px; }
  .home-btn:hover { background: #5e3216; }

  /* Hover specifico per il tasto Torna al portale (sovrascrive .home-btn:hover) */
  a.home-btn[href="../index.html"]:hover { background:#8b0000 !important; color:#fff !important; }
  /* ---------- SIDEBAR NAV ---------- */
  h2.section { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px;
               color: #998870; margin: 18px 0 6px; font-weight: 600; }
  .vol-title { font-size: 13px; font-weight: bold; color: var(--accent);
               margin: 20px 0 4px; padding: 8px 0 6px;
               border-top: 2px solid #c8b898; }
  .nav-item { display: block; padding: 4px 8px; cursor: pointer;
              border-radius: 4px; text-decoration: none; color: var(--ink);
              font-size: 14px; border: none; background: none;
              width: 100%; text-align: left; font-family: inherit; }
  .nav-item:hover { background: #fff6e0; }
  .nav-item.active { background: var(--accent); color: #fff; }

  .lettere { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .lettere .nav-item { text-align: center; font-weight: bold; padding: 8px; }

  .search-box { width: 100%; padding: 7px 10px; font-size: 14px;
                border: 1px solid #c8bea0; border-radius: 5px;
                background: #fff; font-family: inherit; }
  .search-results { margin-top: 8px; max-height: 280px; overflow-y: auto; }
  .search-results .nav-item { font-size: 13px; padding: 3px 8px; }
  .search-results .matched { font-size: 11px; color: #888;
                             display: block; margin-top: 1px; }
  .voce-list .nav-item { font-size: 13px; padding: 3px 8px; }

  /* ---------- CONTENT ---------- */
  article img { max-width: 100%; height: auto; display: block; margin: 20px auto; }
  article .img { text-align: center; }
  article h3 { color: var(--accent); margin: 28px 0 10px; font-size: 20px; }
  article h4 { color: #555; margin: 22px 0 8px; font-size: 17px; }
  article p  { margin-bottom: 10px; }
  article table { border-collapse: collapse; width: 100%; margin: 14px 0; }
  article td { padding: 4px 10px; border-bottom: 1px solid #e0d8c4;
               font-size: 14px; vertical-align: top; }
  article td:first-child { font-weight: bold; white-space: nowrap; width: 60px; }
  article .footnotes { margin-top: 24px; border-top: 1px solid #ccc; padding-top: 12px; }
  article .footnotes p { font-size: 13px; color: #666; }
  mark { background: #ffeaa0; padding: 0 2px; border-radius: 2px; }
  .highlight { background-color: #fff176; font-weight: bold; color: #000; }

  /* ---------- RICERCA AVANZATA (Stile Azaria) ---------- */
  .search-container { padding: 10px; border-bottom: 3px double var(--accent); }
  .local-search-options { font-size: 0.82em; margin-bottom: 8px; color: #5d4037; font-weight: bold; }
  .local-search-options label { cursor: pointer; display: inline-block; margin: 2px 6px 2px 0; white-space: nowrap; }
  .local-search-options label input[type="radio"] { width: 13px; height: 13px; margin: 0 2px 0 0; vertical-align: middle; }
  .search-container input[type="text"],
  .search-container input[type="search"],
  .search-container input[type="number"] { width: 100%; padding: 8px; box-sizing: border-box; border: 2px solid var(--accent); border-radius: 4px; font-family: inherit; font-size: 13px; margin-bottom: 6px; }
  .proximity-fields { display: none; flex-direction: column; gap: 6px; margin-bottom: 6px; }
  .or-fields { display: none; flex-direction: column; gap: 6px; margin-bottom: 6px; }
  .btn-local-search { width: 100%; background-color: var(--accent); color: white; border: none; padding: 9px; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; text-transform: uppercase; font-size: 11px; font-family: inherit; }
  .btn-local-search:hover { filter: brightness(1.2); }

  #search-results-overlay { display: none; background-color: #fdfaf4; border-bottom: 2px solid var(--accent); overflow-y: auto; max-height: 45vh; }
  .search-header-bar { background-color: var(--soft); padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #c0b9a3; position: sticky; top: 0; z-index: 10; }
  .search-summary { font-size: 12px; color: #5d4037; font-weight: bold; }
  .close-search-btn { color: var(--accent); cursor: pointer; font-weight: bold; font-size: 14px; }
  .result-item { background: white; border-bottom: 1px solid #dcd8ce; padding: 12px; cursor: pointer; transition: background 0.2s; font-size: 13px; }
  .result-item:hover { background-color: #fff8e1; border-left: 4px solid #d4af37; padding-left: 8px; }
  .result-item.visited { background-color: #e0d8cc; border-left: 4px solid #5d4037; opacity: 0.8; padding-left: 8px; }
  .res-cap { font-weight: bold; color: var(--accent); font-size: 1em; margin-bottom: 3px; }
  .res-snippet { color: #555; line-height: 1.4; font-size: 12px; }

  .empty { color: #999; font-style: italic; padding: 40px 0; text-align: center; }

  /* ---------- HOME SCREEN ---------- */
  .home-screen { padding: 30px 10px; }
  .home-intro { margin-bottom: 36px; text-align: center; }
  .home-intro h1 { font-size: 28px; color: var(--accent); margin-bottom: 2px; }
  .home-intro .subtitle { font-size: 15px; color: #887860; font-style: italic;
                           margin-bottom: 6px; }
  .home-intro .autore-ed { font-size: 13px; color: #998870; margin-bottom: 18px; }
  .home-intro .desc { font-size: 14.5px; line-height: 1.65; text-align: justify;
                       max-width: 680px; margin: 0 auto; color: #3a3020; }

  .vol-card { display: flex; gap: 24px; align-items: flex-start;
              margin-bottom: 32px; padding-bottom: 28px;
              border-bottom: 1px solid #d4cdb8; }
  .vol-card:last-child { border-bottom: none; }
  .vol-card .cover { flex: 0 0 140px; }
  .vol-card .cover img { width: 140px; border-radius: 4px;
                          box-shadow: 0 4px 14px rgba(0,0,0,.18); }
  .vol-card .info { flex: 1; }
  .vol-card h2 { font-size: 19px; color: var(--accent); margin-bottom: 2px; }
  .vol-card .meta { font-size: 13px; color: #998870; margin-bottom: 10px; }
  .vol-card .vol-desc { font-size: 14px; line-height: 1.6; margin-bottom: 14px;
                         color: #3a3020; }
  .vol-card .guide-btns { display: flex; gap: 10px; flex-wrap: wrap; }
  .guide-btn { padding: 8px 18px; border: 2px solid var(--accent);
               background: transparent; color: var(--accent); border-radius: 6px;
               font-family: inherit; font-size: 12px; font-weight: bold;
               cursor: pointer; transition: all .2s; }
  .guide-btn:hover { background: var(--accent); color: #fff; }

  @media (max-width: 540px) {
    .vol-card { flex-direction: column; align-items: center; text-align: center; }
    .vol-card .cover { flex: none; }
    .vol-card .guide-btns { justify-content: center; }
  }

  /* ---------- MODAL ---------- */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45);
                   display: none; z-index: 100; align-items: center;
                   justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--bg); width: 90%; max-width: 720px;
           max-height: 85vh; border-radius: 10px; overflow: hidden;
           display: flex; flex-direction: column;
           box-shadow: 0 12px 40px rgba(0,0,0,.3); }
  .modal-header { display: flex; align-items: center; justify-content: space-between;
                  padding: 16px 24px; border-bottom: 1px solid #d4cdb8;
                  background: var(--soft); }
  .modal-header h2 { font-size: 18px; color: var(--accent); }
  .modal-close { width: 34px; height: 34px; border-radius: 50%; border: none;
                 background: transparent; font-size: 22px; cursor: pointer;
                 color: #888; display: flex; align-items: center;
                 justify-content: center; transition: all .15s; }
  .modal-close:hover { background: #e0d5c0; color: var(--ink); }
  .modal-body { padding: 24px; overflow-y: auto; flex: 1; }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 740px) {
    .layout { grid-template-columns: 1fr; }
    aside { position: relative; height: auto; }
    main { padding: 20px; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside data-nome-libro="Polifonia Valtortiana">
    <button class="home-btn" id="btn-home">📖 Home Polifonia</button>
    <a href="home.html" class="home-btn" style="text-decoration:none;text-align:center;background:#556b2f;">📚 Studi e Approfondimenti</a>
    <a href="../index.html" class="home-btn" style="text-decoration:none;text-align:center;background:#f4f1ea;color:#8b0000;border:1px solid #8b0000;">🏠 Torna al portale</a>

    <!-- Link agli strumenti della sezione Studi e Approfondimenti -->
    <a href="ricerca_studi.html" class="home-btn" style="text-decoration:none;text-align:center;background:#5d4037;">🔍 Ricerca nei Volumi</a>
    <a href="mia_cronologia.html" class="home-btn" style="text-decoration:none;text-align:center;background:#5d4037;">🕒 Riprendi la lettura</a>
    <a href="miei_appunti.html" class="home-btn" style="text-decoration:none;text-align:center;background:#5d4037;">📝 I miei Appunti</a>

    <h2 class="section">Ricerca nel testo</h2>
    <div class="search-container">
      <div class="local-search-options">
        <label><input type="radio" name="localType" value="simple_partial" checked onchange="toggleLocalMode()"> Parziale</label>
        <label><input type="radio" name="localType" value="simple_exact" onchange="toggleLocalMode()"> Esatta</label>
        <label><input type="radio" name="localType" value="or_exact" onchange="toggleLocalMode()"> Multipla</label>
        <label><input type="radio" name="localType" value="proximity" onchange="toggleLocalMode()"> Concordanze</label>
      </div>
      <div id="localSimpleBox">
        <input type="search" id="local-search-input" placeholder="Cerca parola o frase…" onkeyup="if(event.key==='Enter') startAdvancedLocalSearch()">
      </div>
      <div id="localOrBox" class="or-fields">
        <input type="text" id="orWord1" placeholder="Parola 1">
        <strong style="align-self:center; color:var(--accent); font-size:12px;">OPPURE</strong>
        <input type="text" id="orWord2" placeholder="Parola 2">
      </div>
      <div id="localProxBox" class="proximity-fields">
        <input type="text" id="proxWord1" placeholder="Prima parola">
        <input type="number" id="proxDist" value="30" title="Distanza massima in parole" style="width:80px;">
        <input type="text" id="proxWord2" placeholder="Seconda parola">
      </div>
      <button class="btn-local-search" onclick="startAdvancedLocalSearch()">🔍 Cerca nella Polifonia</button>
    </div>

    <div id="search-results-overlay">
      <div class="search-header-bar">
        <span class="search-summary" id="search-count-display"></span>
        <span class="close-search-btn" onclick="chiudiRicerca()" title="Chiudi ricerca">✖</span>
      </div>
      <div id="local-results"></div>
    </div>

    <div id="sidebar-volumi"></div>
  </aside>

  <main id="content"></main>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title"></h2>
      <button class="modal-close" id="modal-close" aria-label="Chiudi">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script src="polifonia_v1.js"></script>
<script src="polifonia_v2.js"></script>
<script>
(() => {
  const volumi = [
    { data: polifonia_v1, label: "Volume 1 (A–G)", lettereLabel: "Voci A – G" },
    { data: polifonia_v2, label: "Volume 2 (H–Z)", lettereLabel: "Voci H – Z" }
  ];
  const $ = id => document.getElementById(id);

  /* -------- MODALE -------- */
  function apriModale(titolo, html) {
    $('modal-title').textContent = titolo;
    $('modal-body').innerHTML = html;
    $('modal-overlay').classList.add('open');
  }
  function chiudiModale() { $('modal-overlay').classList.remove('open'); }
  $('modal-close').onclick = chiudiModale;
  $('modal-overlay').onclick = e => { if (e.target === $('modal-overlay')) chiudiModale(); };
  document.addEventListener('keydown', e => { if (e.key === 'Escape') chiudiModale(); });

  /* -------- BUILD SIDEBAR -------- */
  const sidebar = $('sidebar-volumi');
  volumi.forEach((vol, vi) => {
    const A = vol.data;

    // titolo volume
    const vt = document.createElement('div');
    vt.className = 'vol-title';
    vt.textContent = vol.label;
    sidebar.appendChild(vt);

    // capitoli iniziali
    const h2i = document.createElement('h2');
    h2i.className = 'section'; h2i.textContent = 'Capitoli iniziali';
    sidebar.appendChild(h2i);
    A.capitoliIniziali.forEach(c => {
      const b = document.createElement('button');
      b.className = 'nav-item'; b.textContent = c.titolo;
      b.dataset.id = `v${vi}-${c.id}`;
      b.onclick = () => mostraCapitolo(c, vi);
      sidebar.appendChild(b);
    });

    // lettere
    const h2l = document.createElement('h2');
    h2l.className = 'section'; h2l.textContent = vol.lettereLabel;
    sidebar.appendChild(h2l);
    const grid = document.createElement('div');
    grid.className = 'lettere';
    A.lettere.forEach(l => {
      const b = document.createElement('button');
      b.className = 'nav-item'; b.textContent = l.iniziale;
      b.title = `${l.voci.length} voci`;
      b.dataset.id = `v${vi}-let-${l.iniziale}`;
      b.onclick = () => mostraLettera(l, vi);
      grid.appendChild(b);
    });
    sidebar.appendChild(grid);

    // capitoli finali
    const h2f = document.createElement('h2');
    h2f.className = 'section'; h2f.textContent = 'Capitoli finali';
    sidebar.appendChild(h2f);
    A.capitoliFinali.forEach(c => {
      const b = document.createElement('button');
      b.className = 'nav-item'; b.textContent = c.titolo;
      b.dataset.id = `v${vi}-${c.id}`;
      b.onclick = () => mostraCapitolo(c, vi);
      sidebar.appendChild(b);
    });
  });

  /* -------- HOME -------- */
  $('btn-home').onclick = mostraHome;

  function mostraHome() {
    clearActive();
    // Chiudi ricerca se aperta
    isSearchActive = false;
    searchKeywords = [];
    document.getElementById('search-results-overlay').style.display = 'none';
    const searchInput = document.getElementById('local-search-input');
    if (searchInput) searchInput.value = '';

    // FIX SCROLL: azzera lo stato corrente così gli eventi scroll che seguono
    // (mentre la pagina torna in cima) non sovrascrivono la posizione salvata della voce precedente
    window.currentPolifoniaVi = undefined;
    window.currentPolifoniaType = undefined;
    window.currentPolifoniaId = undefined;

    const covers = ['images/PolifoniaValtortiana1.jpg', 'images/PolifoniaValtortiana2.jpg'];
    const descs = [
      'Pubblicazione: Settembre 2023. Raccoglie le prime 579 biografie dei personaggi le cui iniziali vanno dalla A alla G. Introduce l\u2019impianto critico dell\u2019opera: ogni voce offre uno specifico punto di vista su Ges\u00f9 e sugli eventi della sua vita. L\u2019analisi mostra come le micro-storie dei singoli personaggi, pur se accennate in punti diversi e distanti dell\u2019opera valtortiana, mantengano una coerenza psicologica, storica e cronologica assoluta.',
      'Pubblicazione: Marzo 2026. Completa il dizionario coprendo tutte le restanti voci dalla H alla Z. Con la prefazione di don Ernesto Zucchini, questo volume consolida l\u2019analisi letteraria complessiva, mostrando come anche i dettagli pi\u00f9 minuti o i personaggi pi\u00f9 marginali concorrano a purificare la figura dell\u2019Uomo-Dio dalle stratificazioni storiche, restituendo una visione corale (da qui il termine \u201cPolifonia\u201d) estremamente nitida e fruibile.'
    ];

    let html = '<div class="home-screen">';
    // Introduzione generale
    html += `<div class="home-intro">
      <h1>Polifonia Valtortiana</h1>
      <p class="subtitle">Tutti i personaggi dell\u2019<em>Evangelo come mi \u00e8 stato rivelato</em></p>
      <p class="autore-ed">Francesco Di Traglia &middot; Fede &amp; Cultura</p>
      <p class="desc">Un monumentale dizionario biografico e letterario che analizza l\u2019immenso capolavoro della mistica Maria Valtorta attraverso la lente dei suoi personaggi. L\u2019obiettivo di fondo \u00e8 metterne in luce la straordinaria coesione interna e l\u2019assenza di incongruenze narrative, dimostrando come circa 1.600 figure \u2013 tra apostoli, passanti, notabili o figure storiche \u2013 si incastrino in un\u2019architettura perfetta e senza contraddizioni.</p>
    </div>`;

    // Card per ogni volume
    volumi.forEach((vol, vi) => {
      const A = vol.data;
      html += `<div class="vol-card">
        <div class="cover"><img src="${covers[vi]}" alt="Copertina ${vol.label}"></div>
        <div class="info">
          <h2>${A.titolo}</h2>
          <p class="meta">${A.autore}</p>
          <p class="vol-desc">${descs[vi]}</p>
          <div class="guide-btns">`;
      (A.guide || []).forEach(g => {
        html += `<button class="guide-btn" data-vi="${vi}" data-gid="${g.id}">${g.titolo}</button>`;
      });
      html += `</div></div></div>`;
    });

    // Chiusura
    html += `<p style="font-size:13px;color:#998870;text-align:center;margin-top:10px;font-style:italic;">I due volumi non sono una semplice lista di nomi, ma uno strumento di studio per chiunque voglia approfondire l\u2019intreccio narrativo valtortiano e apprezzare la complessit\u00e0 strutturale di un testo che, pur scritto di getto e senza schemi preventivi, si rivela geometricamente perfetto.</p>`;
    html += '</div>';

    $('content').innerHTML = html;
    $('content').querySelectorAll('.guide-btn').forEach(btn => {
      btn.onclick = () => {
        const vi = parseInt(btn.dataset.vi);
        const g = (volumi[vi].data.guide || []).find(g => g.id === btn.dataset.gid);
        if (g) apriModale(g.titolo, g.testo);
      };
    });
  }

  /* -------- RICERCA AVANZATA (Stile Azaria) -------- */
  let isSearchActive = false;
  let searchKeywords = [];
  let searchIsPartial = false;

  // Esponi le funzioni di ricerca al scope globale (fuori dalla IIFE)
  window.toggleLocalMode = function() {
    const type = document.querySelector('input[name="localType"]:checked').value;
    document.getElementById('localSimpleBox').style.display = (type === 'simple_partial' || type === 'simple_exact') ? 'block' : 'none';
    document.getElementById('localOrBox').style.display = (type === 'or_exact') ? 'flex' : 'none';
    document.getElementById('localProxBox').style.display = (type === 'proximity') ? 'flex' : 'none';
  };

  window.chiudiRicerca = function() {
    document.getElementById('search-results-overlay').style.display = 'none';
    isSearchActive = false;
    searchKeywords = [];
  };

  window.startAdvancedLocalSearch = function() {
    const type = document.querySelector('input[name="localType"]:checked').value;
    let terms = [], dist = 30;

    if (type === 'simple_partial' || type === 'simple_exact') {
      const val = document.getElementById('local-search-input').value.trim().toLowerCase();
      if (val.length < 3) { alert("Inserisci almeno 3 lettere."); return; }
      terms = [val];
    } else if (type === 'or_exact') {
      const w1 = document.getElementById('orWord1').value.trim().toLowerCase();
      const w2 = document.getElementById('orWord2').value.trim().toLowerCase();
      if (!w1 || !w2) { alert("Inserisci entrambe le parole."); return; }
      terms = [w1, w2];
    } else {
      const w1 = document.getElementById('proxWord1').value.trim().toLowerCase();
      const w2 = document.getElementById('proxWord2').value.trim().toLowerCase();
      dist = parseInt(document.getElementById('proxDist').value) || 30;
      if (!w1 || !w2) { alert("Inserisci entrambe le parole."); return; }
      terms = [w1, w2];
    }

    // Cerca in tutte le voci + capitoli di tutti i volumi
    let results = [];
    volumi.forEach((vol, vi) => {
      const A = vol.data;
      // Capitoli iniziali/finali
      [...(A.capitoliIniziali || []), ...(A.capitoliFinali || [])].forEach(cap => {
        const match = cercaInTesto(cap.testo, terms, type, dist);
        if (match) results.push({ vi, tipo: 'cap', id: cap.id, titolo: cap.titolo, snippet: match, item: cap });
      });
      // Voci delle lettere
      (A.lettere || []).forEach(l => {
        l.voci.forEach(v => {
          const match = cercaInTesto(v.testo, terms, type, dist);
          if (match) results.push({ vi, tipo: 'voce', id: v.id, titolo: v.voce, snippet: match, item: v });
        });
      });
    });

    // Mostra risultati
    searchKeywords = terms;
    searchIsPartial = (type === 'simple_partial');
    isSearchActive = true;

    const overlay = document.getElementById('search-results-overlay');
    const resultsDiv = document.getElementById('local-results');
    const countDisplay = document.getElementById('search-count-display');

    overlay.style.display = 'block';
    countDisplay.textContent = `Trovati: ${results.length}`;
    resultsDiv.innerHTML = '';

    if (results.length === 0) {
      resultsDiv.innerHTML = '<div style="padding:15px; text-align:center; color:#666;">Nessun risultato trovato.</div>';
      return;
    }

    results.forEach(res => {
      const div = document.createElement('div');
      div.className = 'result-item';
      let hSnippet = res.snippet;
      terms.forEach(w => {
        const safeW = w.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
        let r = searchIsPartial ? new RegExp('(' + safeW + ')', 'gi') : new RegExp('(?<!\\p{L})(' + safeW + ')(?!\\p{L})', 'giu');
        hSnippet = hSnippet.replace(r, "<span class='highlight'>$1</span>");
      });
      const volLabel = res.vi === 0 ? 'Vol.1' : 'Vol.2';
      div.innerHTML = `<div class="res-cap">${esc(res.titolo)} <small style="color:#888">(${volLabel})</small></div><div class="res-snippet"><small>${hSnippet}</small></div>`;
      div.onclick = function() {
        this.classList.add('visited');
        if (res.tipo === 'voce') mostraVoce(res.item, terms[0], res.vi);
        else mostraCapitolo(res.item, res.vi);
      };
      resultsDiv.appendChild(div);
    });
  };

  function cercaInTesto(testo, terms, type, dist) {
    const clean = testo.replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ').toLowerCase();
    if (type === 'simple_partial') {
      const idx = clean.indexOf(terms[0]);
      if (idx === -1) return null;
      return estraiSnippet(clean, idx, terms[0].length);
    } else if (type === 'simple_exact') {
      const re = new RegExp('(?<!\\p{L})(' + terms[0].replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&') + ')(?!\\p{L})', 'giu');
      const m = re.exec(clean);
      if (!m) return null;
      return estraiSnippet(clean, m.index, m[0].length);
    } else if (type === 'or_exact') {
      for (const t of terms) {
        const re = new RegExp('(?<!\\p{L})(' + t.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&') + ')(?!\\p{L})', 'giu');
        const m = re.exec(clean);
        if (m) return estraiSnippet(clean, m.index, m[0].length);
      }
      return null;
    } else { // proximity
      const words = clean.split(/\s+/);
      for (let i = 0; i < words.length; i++) {
        if (words[i].includes(terms[0])) {
          for (let j = Math.max(0, i - dist); j < Math.min(words.length, i + dist + 1); j++) {
            if (j !== i && words[j].includes(terms[1])) {
              const start = clean.indexOf(words[Math.min(i, j)]);
              return estraiSnippet(clean, start, 80);
            }
          }
        }
      }
      return null;
    }
  }

  function estraiSnippet(text, start, len) {
    const from = Math.max(0, start - 60);
    const to = Math.min(text.length, start + len + 120);
    let s = text.substring(from, to);
    if (from > 0) s = '…' + s;
    if (to < text.length) s = s + '…';
    return s;
  }

  /* -------- VISUALIZZAZIONI -------- */
  function clearActive() {
    document.querySelectorAll('.nav-item.active').forEach(el => el.classList.remove('active'));
  }

  function mostraCapitolo(cap, vi) {
    clearActive();
    const btn = document.querySelector(`.nav-item[data-id$="-${cap.id}"]`);
    if (btn) btn.classList.add('active');
    let titolo = cap.titolo;
    const notaMatch = titolo.match(/\[(\d+)\]$/);
    const numNota = notaMatch ? notaMatch[1] : null;
    if (numNota) titolo = titolo.slice(0, -notaMatch[0].length);
    let linkNota = '';
    if (numNota) linkNota = `<a href="#nota-${numNota}"><sup style="font-size:0.6em;">[${numNota}]</sup></a>`;
    $('content').innerHTML = `<article><h1 style="color:var(--accent);margin-bottom:20px">${titolo}${linkNota}</h1>${cap.testo}</article>`;
    window.scrollTo(0, 0);
    // --- HOOK CRONOLOGIA + APPUNTI ---
    aggiornaStato(vi, 'cap', cap.id, cap.titolo);
  }

  function mostraLettera(l, vi) {
    clearActive();
    const btn = document.querySelector(`.nav-item[data-id$="-let-${l.iniziale}"]`);
    if (btn) btn.classList.add('active');
    let html = `<article><h1 style="color:var(--accent);margin-bottom:4px">${l.titolo}</h1>`;
    html += `<p style="color:#998870;margin-bottom:20px">${l.voci.length} voci</p>`;
    html += `<div class="voce-list">`;
    l.voci.forEach(v => {
      html += `<button class="nav-item" data-vid="${v.id}">${esc(v.voce)}</button>`;
    });
    html += `</div></article>`;
    $('content').innerHTML = html;
    $('content').querySelectorAll('.voce-list .nav-item').forEach(a => {
      a.onclick = () => {
        const voce = l.voci.find(v => v.id === parseInt(a.dataset.vid));
        if (voce) mostraVoce(voce, null, vi);
      };
    });
    window.scrollTo(0, 0);
  }

  function mostraVoce(voce, evidenzia, vi) {
    clearActive();
    let htmlTesto = voce.testo;

    // Evidenziazione stile Azaria: solo nel testo tra i tag, mai dentro i tag
    if (isSearchActive && searchKeywords.length > 0) {
      searchKeywords.forEach(kw => {
        const safeKw = kw.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
        let regex = searchIsPartial ? new RegExp('(' + safeKw + ')', 'gi') : new RegExp('(?<!\\p{L})(' + safeKw + ')(?!\\p{L})', 'giu');
        htmlTesto = htmlTesto.replace(/>([^<]*)</g, (match, text) => {
          return '>' + text.replace(regex, "<span class='highlight'>$1</span>") + '<';
        });
      });
    } else if (evidenzia) {
      // Evidenziazione singola parola (da ricerca universale o link diretto)
      const safeQ = evidenzia.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
      const re = new RegExp('(' + safeQ + ')', 'gi');
      htmlTesto = htmlTesto.replace(/>([^<]*)</g, (match, text) => {
        return '>' + text.replace(re, "<span class='highlight'>$1</span>") + '<';
      });
    }

    $('content').innerHTML = `<article><h2 style="color:var(--accent);margin-bottom:16px">${esc(voce.voce)}</h2>${htmlTesto}</article>`;

    // Scroll: se c'è evidenziazione, vai al primo risultato; altrimenti in cima
    const firstHighlight = $('content').querySelector('.highlight');
    if (firstHighlight) {
      scrollToHighlight(firstHighlight, 350);
    } else {
      window.scrollTo(0, 0);
    }

    // --- HOOK CRONOLOGIA + APPUNTI ---
    if (vi !== undefined && vi !== null) aggiornaStato(vi, 'voce', voce.id, voce.voce);
  }

  /* -------- SCROLL iOS-COMPATIBILE -------- */
  // Su Safari/iOS scrollIntoView con behavior:'smooth' è inaffidabile quando
  // il contenuto viene appena iniettato. Usiamo window.scrollTo con getBoundingClientRect.
  function scrollToHighlight(el, delay) {
    setTimeout(() => {
      if (!el) return;
      const rect = el.getBoundingClientRect();
      const targetY = window.pageYOffset + rect.top - (window.innerHeight / 2) + (rect.height / 2);
      window.scrollTo({ top: Math.max(0, targetY), behavior: 'smooth' });
    }, delay || 350);
  }

  /* -------- UTILITÀ -------- */
  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function evidenziaQuery(html, query) {
    const safe = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp(`(${safe})`, 'gi');
    return html.split(/(<[^>]+>)/g).map(p => p.startsWith('<') ? p : p.replace(re, '<mark>$1</mark>')).join('');
  }

  /* -------- CRONOLOGIA + APPUNTI (Hook) -------- */
  function aggiornaStato(vi, tipo, id, titolo) {
    // Aggiorna data-nome-libro per appunti.js
    const volLabel = vi === 0 ? "Polifonia Valtortiana - Vol. 1 (A-G)" : "Polifonia Valtortiana - Vol. 2 (H-Z)";
    const aside = document.querySelector('[data-nome-libro]');
    if (aside) aside.setAttribute('data-nome-libro', volLabel);
    
    // Salva stato globale per appunti.js
    window.currentPolifoniaVi = vi;
    window.currentPolifoniaType = tipo;
    window.currentPolifoniaId = id;

    // Salva in cronologia (se lo script è caricato)
    if (typeof salvaInCronologia === 'function') {
      salvaInCronologia(
        id,
        titolo,
        volLabel,
        "PolifoniaValtortiana",
        "/polifonia.html?vi=" + vi + "&type=" + tipo + "&id="
      );
    }
    // Ripristina evidenze e appunti (se lo script è caricato)
    if (typeof window.ripristinaEvidenze === 'function') {
      setTimeout(window.ripristinaEvidenze, 500);
    }
  }

  /* -------- RIPRISTINO DA URL (Cronologia / Appunti / Ricerca) -------- */
  function ripristinaDaUrl() {
    const params = new URLSearchParams(window.location.search);
    const vi = parseInt(params.get('vi'));

    // --- CASO 1: Da Cronologia o Appunti (?vi=0&type=voce&id=123) ---
    const tipo = params.get('type');
    const id = params.get('id');
    if (!isNaN(vi) && tipo && id) {
      const vol = volumi[vi];
      if (!vol) return false;
      const A = vol.data;

      if (tipo === 'voce') {
        const numId = parseInt(id);
        for (const l of (A.lettere || [])) {
          const voce = l.voci.find(v => v.id === numId);
          if (voce) {
            mostraVoce(voce, null, vi);
            // Ripristina posizione scroll
            ripristinaScrollPolifonia(vi, tipo, numId);
            return true;
          }
        }
      } else if (tipo === 'cap') {
        const cap = [...(A.capitoliIniziali || []), ...(A.guide || []), ...(A.capitoliFinali || [])]
                    .find(c => c.id === id);
        if (cap) {
          mostraCapitolo(cap, vi);
          ripristinaScrollPolifonia(vi, tipo, id);
          return true;
        }
      }
    }

    // --- CASO 2: Da Ricerca Universale (?vi=0&idx=5&keys=...) ---
    const idx = parseInt(params.get('idx'));
    if (!isNaN(vi) && !isNaN(idx)) {
      const vol = volumi[vi];
      if (!vol) return false;
      const A = vol.data;
      // Ricostruisci lo stesso array piatto usato dalla Ricerca Universale
      const flat = [...(A.capitoliIniziali || []), ...(A.guide || []), ...(A.capitoliFinali || []),
                    ...(A.lettere || []).flatMap(l => l.voci)];
      const item = flat[idx];
      if (item) {
        const keys = params.get('keys');
        // Evidenzia PRIMA dell'inserimento nel DOM (come fa la ricerca interna)
        if (item.voce) {
          renderVoceConEvidenziazione(item, keys, vi);
        } else {
          renderCapitoloConEvidenziazione(item, keys, vi);
        }
        return true;
      }
    }

    return false;
  }

  // --- Rendering con evidenziazione pre-DOM (Stile Azaria: >testo<) ---
  function renderVoceConEvidenziazione(voce, keys, vi) {
    clearActive();
    let htmlTesto = voce.testo;
    if (keys) {
      decodeURIComponent(keys).split(',').forEach(kw => {
        const safeKw = kw.trim().replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
        const regex = new RegExp('(' + safeKw + ')', 'gi');
        htmlTesto = htmlTesto.replace(/>([^<]*)</g, (match, text) => {
          return '>' + text.replace(regex, "<span class='highlight'>$1</span>") + '<';
        });
      });
    }
    $('content').innerHTML = `<article><h2 style="color:var(--accent);margin-bottom:16px">${esc(voce.voce)}</h2>${htmlTesto}</article>`;
    const firstH = $('content').querySelector('.highlight');
    if (firstH) scrollToHighlight(firstH, 350);
    else window.scrollTo(0, 0);
    // Cronologia deferred (gli script esterni non sono ancora caricati durante l'IIFE)
    aggiornaStatoDeferred(vi, 'voce', voce.id, voce.voce);
  }

  function renderCapitoloConEvidenziazione(cap, keys, vi) {
    clearActive();
    const btn = document.querySelector(`.nav-item[data-id$="-${cap.id}"]`);
    if (btn) btn.classList.add('active');
    let titolo = cap.titolo;
    const notaMatch = titolo.match(/\[(\d+)\]$/);
    const numNota = notaMatch ? notaMatch[1] : null;
    if (numNota) titolo = titolo.slice(0, -notaMatch[0].length);
    let linkNota = '';
    if (numNota) linkNota = `<a href="#nota-${numNota}"><sup style="font-size:0.6em;">[${numNota}]</sup></a>`;
    let htmlTesto = cap.testo;
    if (keys) {
      decodeURIComponent(keys).split(',').forEach(kw => {
        const safeKw = kw.trim().replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
        const regex = new RegExp('(' + safeKw + ')', 'gi');
        htmlTesto = htmlTesto.replace(/>([^<]*)</g, (match, text) => {
          return '>' + text.replace(regex, "<span class='highlight'>$1</span>") + '<';
        });
      });
    }
    $('content').innerHTML = `<article><h1 style="color:var(--accent);margin-bottom:20px">${titolo}${linkNota}</h1>${htmlTesto}</article>`;
    const firstH = $('content').querySelector('.highlight');
    if (firstH) scrollToHighlight(firstH, 350);
    else window.scrollTo(0, 0);
    aggiornaStatoDeferred(vi, 'cap', cap.id, cap.titolo);
  }

  // Cronologia deferred: quando arriviamo dalla ricerca universale, gli script
  // (cronologia.js, appunti.js) non sono ancora caricati perché il tag <script>
  // è dopo l'IIFE. Aspettiamo il load della pagina.
  function aggiornaStatoDeferred(vi, tipo, id, titolo) {
    // Aggiorna subito il DOM (non dipende da script esterni)
    const volLabel = vi === 0 ? "Polifonia Valtortiana - Vol. 1 (A-G)" : "Polifonia Valtortiana - Vol. 2 (H-Z)";
    const aside = document.querySelector('[data-nome-libro]');
    if (aside) aside.setAttribute('data-nome-libro', volLabel);
    window.currentPolifoniaVi = vi;
    window.currentPolifoniaType = tipo;
    window.currentPolifoniaId = id;

    // Ritarda il salvataggio cronologia fino a quando gli script sono caricati
    window.addEventListener('load', () => {
      if (typeof salvaInCronologia === 'function') {
        salvaInCronologia(id, titolo, volLabel, "PolifoniaValtortiana", "/polifonia.html?vi=" + vi + "&type=" + tipo + "&id=");
      }
      if (typeof window.ripristinaEvidenze === 'function') {
        setTimeout(window.ripristinaEvidenze, 500);
      }
    }, { once: true });
  }

  // --- Salvataggio e Ripristino Scroll per Polifonia ---
  function getScrollKey() {
    if (window.currentPolifoniaVi !== undefined && window.currentPolifoniaType !== undefined && window.currentPolifoniaId !== undefined) {
      return 'polif_scroll_' + window.currentPolifoniaVi + '_' + window.currentPolifoniaType + '_' + window.currentPolifoniaId;
    }
    return null;
  }

  function ripristinaScrollPolifonia(vi, tipo, id) {
    const chiave = 'polif_scroll_' + vi + '_' + tipo + '_' + id;
    let posizioni = JSON.parse(localStorage.getItem('valtorta_scroll_posizioni')) || {};
    if (posizioni[chiave]) {
      setTimeout(() => {
        window.scrollTo({ top: posizioni[chiave], behavior: 'smooth' });
      }, 600);
    }
  }

  // Salvataggio della posizione scroll corrente — funzione condivisa
  function salvaScrollCorrente() {
    const chiave = getScrollKey();
    if (!chiave) return; // nessuna voce/capitolo attivo, niente da salvare
    let posizioni = JSON.parse(localStorage.getItem('valtorta_scroll_posizioni')) || {};
    posizioni[chiave] = window.scrollY;
    localStorage.setItem('valtorta_scroll_posizioni', JSON.stringify(posizioni));
  }

  // PATTERN DEI QUADERNI: salva continuamente durante la lettura (debounce 500ms).
  // Questo funziona anche su iOS dove beforeunload è inaffidabile.
  let _scrollSaveTimeout;
  window.addEventListener('scroll', () => {
    clearTimeout(_scrollSaveTimeout);
    _scrollSaveTimeout = setTimeout(salvaScrollCorrente, 500);
  }, { passive: true });

  // Rete di sicurezza: salva anche all'uscita.
  // beforeunload funziona su desktop, pagehide è il sostituto affidabile su iOS Safari,
  // visibilitychange copre il caso in cui l'utente sposta l'app in background.
  window.addEventListener('beforeunload', salvaScrollCorrente);
  window.addEventListener('pagehide', salvaScrollCorrente);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') salvaScrollCorrente();
  });

  /* -------- AVVIO -------- */
  if (!ripristinaDaUrl()) mostraHome();
})();
</script>
